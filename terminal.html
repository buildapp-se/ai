<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>./terminal | Lär dig terminalen</title>
<meta name="description" content="Uppgifter faller som tetrisblock. Skriv rätt terminalkommando innan de når botten: filer, git, GitHub och verktygen Claude Code använder.">
<link rel="canonical" href="https://buildapp.se/ai/terminal.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Färger från VS Code Dark Modern och dess terminal */
:root{color-scheme:dark;--bg:#181818;--editor:#1F1F1F;--border:#2B2B2B;--fg:#CCCCCC;--dim:#9D9D9D;--faint:#6E7681;--accent:#0078D4;
  --green:#23D18B;--blue:#3B8EEA;--red:#F14C4C;--yellow:#E5C07B;--comment:#6A9955;
  --key:#9CDCFE;--str:#CE9178;--num:#B5CEA8;--brace:#FFD700;
  --ui:"Segoe WPC","Segoe UI",system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',Consolas,Menlo,monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.win{display:flex;flex-direction:column;height:100dvh}

.titlebar{height:35px;flex:none;display:flex;align-items:center;gap:6px;padding-left:8px;background:var(--bg);border-bottom:1px solid var(--border);color:var(--dim)}
.titlebar img{width:16px;height:16px;margin-right:4px}
.menu span{padding:3px 7px;border-radius:4px}
.cmdcenter{flex:0 1 380px;margin:0 auto;height:24px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #3C3C3C;border-radius:6px;background:#222;color:var(--dim)}
.winctl{display:flex;height:100%}
.winctl span{width:46px;display:grid;place-items:center}

.main{flex:1;display:flex;min-height:0}
.activity{width:48px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:4px;color:#868686}
.activity span{width:48px;height:48px;display:grid;place-items:center}
.activity span:first-child{color:#D7D7D7;box-shadow:inset 2px 0 var(--accent)}
.work{flex:1;display:flex;flex-direction:column;min-width:0}

.editor{flex:none;background:var(--editor)}
.tabs{display:flex;height:35px;background:var(--bg);border-bottom:1px solid var(--border)}
.tab{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--border);color:var(--dim)}
.tab.on{background:var(--editor);color:#fff;box-shadow:inset 0 1px var(--accent);margin-bottom:-1px}
.tab b{color:var(--brace);font-weight:400;font-family:var(--mono)}
.crumbs{padding:2px 16px;color:var(--dim);font-size:12px}
.code{display:grid;grid-template-columns:50px 1fr;font:13px/19px var(--mono);padding:2px 0 8px;white-space:pre}
.code .ln{color:var(--faint);text-align:right;padding-right:22px}
.k{color:var(--key)}.s{color:var(--str)}.n{color:var(--num)}.br{color:var(--brace)}

.panel{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--border);background:var(--bg)}
.ptabs{height:35px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;font-size:11px;letter-spacing:.04em}
.ptabs{overflow:hidden}
.ptabs>span{padding:0 6px;line-height:33px;color:var(--dim);white-space:nowrap}
.ptabs>span.on{color:#E7E7E7;box-shadow:inset 0 -1px #E7E7E7}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#616161;color:#fff;text-align:center;line-height:18px;letter-spacing:0}
.badge[data-n="0"]{display:none}
.pright{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--dim);letter-spacing:0;font-size:12px}

.term{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 20px 6px;font:14px/1.4 var(--mono);cursor:text}
.well{position:relative;flex:1;min-height:0;overflow:hidden}
.log{flex:none;height:9.8em;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.prompt{flex:none;display:flex;white-space:pre}
.u{color:var(--green);font-weight:700}.p{color:var(--blue);font-weight:700}
.err{color:var(--red)}.cmt{color:var(--comment)}.hot{color:var(--yellow)}.dim{color:var(--faint)}
.line.bad{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cmdbox{position:relative;flex:1;min-width:0}
#cmd{position:absolute;inset:0;width:100%;font:inherit;background:transparent;border:0;outline:0;color:transparent;caret-color:transparent}
#cmd::selection{background:#264F78;color:transparent}
#mirror{white-space:pre;overflow:hidden}
.cur{background:var(--fg);color:var(--bg)}
.blur .cur{background:none;outline:1px solid var(--fg)}
.play .cur,.menu-on .cur{animation:blink 1.06s step-end infinite}
@keyframes blink{50%{background:none;color:inherit}}

/* Blocken: TUI-ramar i paketets färg */
.blk{position:absolute;top:0;padding:.55em .9em .5em;border:1px solid var(--c);background:var(--bg);will-change:transform;transition:opacity .3s,border-color .3s}
.blk .tag{position:absolute;top:-.75em;left:.7em;padding:0 .35em;background:var(--bg);color:var(--c);font-size:12px}
.blk p{color:#E7E7E7}
.blk .prog{color:var(--c);font-size:12px;margin-top:.2em}
.blk .ans{display:none;color:var(--dim);font-size:13px;margin-top:.25em}
.blk.landed{border-color:#4A4A4A;--c:#6E6E6E}
.blk.landed p{color:var(--dim)}
.blk.landed .ans{display:block}
.blk.done{opacity:0;border-color:var(--green);box-shadow:0 0 18px var(--green)}
.blk.miss{animation:shake .25s}

.screen{position:absolute;inset:0;overflow:auto;padding:12px 0 8px;z-index:5;background:var(--bg)}
.screen[hidden]{display:none}
.logo{font:clamp(5px,1.5vw,12px)/1.1 var(--mono);color:var(--blue);white-space:pre;margin:4px 0 10px}
.logo.over{color:var(--red)}
.screen h2{font:inherit;color:var(--comment);margin-top:1.1em}
.cols{display:grid;gap:0 6ch}
@media (min-width:1000px){.cols{grid-template-columns:auto minmax(0,64ch)}}
.screen p{max-width:76ch}
.opts{display:flex;flex-direction:column;align-items:flex-start}
.opt{padding:1px 6px;margin-left:-6px;text-align:left;white-space:pre}
.opt[aria-pressed=true]{background:#264F78;color:#fff}
.opt:hover{background:#2A2D2E}
.opt[aria-pressed=true]:hover{background:#264F78}
.opt .dim{margin-left:1ch}
.lvl{display:flex;align-items:center;gap:1ch}
.lvl button{padding:0 6px;color:var(--blue)}
.scores{border-collapse:collapse}
.scores td{padding:0 2ch 0 0;white-space:nowrap}
.scores td:nth-child(2){text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:1ch 3ch;margin-top:1.1em}
.actions button{color:var(--blue)}
.actions button:hover,.lvl button:hover{text-decoration:underline}
kbd{font:inherit;color:var(--yellow)}

.status{height:22px;flex:none;display:flex;align-items:center;border-top:1px solid var(--border);color:var(--fg);font-size:12px}
.status>span,.status>button{display:flex;align-items:center;gap:4px;height:100%;padding:0 8px;white-space:nowrap}
.status .remote{background:var(--accent);color:#fff;padding:0 10px}
.status .sp{margin-left:auto}
.status>button:hover{background:#2A2D2E}

@media (max-height:760px),(max-width:700px){.editor{display:none}}
@media (max-width:700px){.activity,.menu,.winctl,.status .hide,.ptabs>span:not(.on):not(:first-child),.pright{display:none}.term{padding:0 10px 6px;font-size:13px}.cmdcenter{flex-basis:auto;padding:0 12px}}
@media (prefers-reduced-motion:reduce){.blk{transition:none}.line.bad,.blk.miss{animation:none}}
</style>
</head>

<script>
/* pure:start  (ren logik utan DOM, testas av terminal.test.js) */
const PACKS = {

  cc: {name: 'Som Claude Code', tag: 'claude', c: '#C586C0', hint: 'grep, curl, find, jq, npm'},
  all: {name: 'Allt', hint: 'alla tre blandat'},

const POOLS = {
  d: ['musik', 'bilder', 'recept', 'kvitton', 'skola', 'backup', 'demo', 'assets', 'docs', 'src', 'semester', 'spel'],
  f: ['notes.txt', 'todo.md', 'index.html', 'app.js', 'style.css', 'data.json', 'README.md', 'config.yml', 'main.py'],

// Kedja: en lista av listor, ett steg per kommando. {any} godtar vilket ord som helst.

const OPS = new Set(['|', '>', '>>', '&&', ';', '||']);
const ANY = '{any}';

const VALS = {git: 'mbcCdD', head: 'nc', tail: 'nc', grep: 'eABCm', curl: 'XHdo', lsof: 'ip', ssh: 'ip', kill: 's', tar: 'fC', sed: 'e', du: 'd', sort: 'k'};

// Delar en rad som bash: citattecken, backslash och operatorer. Oavslutat citat kastar fel.
function tokenize(s) {
  const out = [];
  let cur = '', has = false, i = 0;
  const push = () => { if (has) out.push(cur); cur = ''; has = false; };
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { push(); i++; continue; }
    if (ch === "'") {
      const j = s.indexOf("'", i + 1);
      if (j < 0) throw new Error("'");
      cur += s.slice(i + 1, j); has = true; i = j + 1; continue;
    }
    if (ch === '"') {
      i++; has = true;
      while (i < s.length && s[i] !== '"') { if (s[i] === '\\' && i + 1 < s.length) i++; cur += s[i++]; }
      if (i >= s.length) throw new Error('"');
      i++; continue;
    }
    if (ch === '\\' && i + 1 < s.length) { cur += s[i + 1]; has = true; i += 2; continue; }
    const op = ['&&', '||', '>>', '|', ';', '>'].find(o => s.startsWith(o, i));
    if (op) { push(); out.push(op); i += op.length; continue; }
    cur += ch; has = true; i++;
  }
  push();
  return out;
}

// Delar på && ; || till separata kommandon
function segments(tokens) {
  const segs = [[]];
  for (const t of tokens) if (t === '&&' || t === ';' || t === '||') segs.push([]); else segs.at(-1).push(t);
  return segs.filter(s => s.length);
}

// mkdir a b blir mkdir a + mkdir b, så att ett kommando kan rensa flera block
const MULTI = new Set(['mkdir', 'touch', 'rm', 'rmdir']);
function units(seg) {
  const [cmd, ...rest] = seg;
  if (!MULTI.has(cmd) || rest.some(t => OPS.has(t))) return [seg];

  return args.length > 1 ? args.map(a => [cmd, ...flags, a]) : [seg];
}

const path = t => t.replace(/^\.\/(?=.)/, '').replace(/(.)\/$/, '$1');

// Normalform: positionella argument i ordning, flaggor sorterade och ihopslagna (-rn = -r -n)
function canon(seg) {
  const out = [];
  let stage = [];
  const flush = () => { if (stage.length) out.push(...canonStage(stage)); stage = []; };
  for (const t of seg) if (t === '|') { flush(); out.push('|'); } else stage.push(t);
  flush();

}
function canonStage([cmd, ...rest]) {
  if (cmd === 'find') return [cmd, ...rest.map(path)]; // find har långa flaggor med ett streck, -name
  const vals = VALS[cmd] || '', pos = [], flags = [];
  for (let i = 0; i < rest.length; i++) {
    const t = rest[i], next = rest[i + 1];
    const free = next !== undefined && !next.startsWith('-') && !OPS.has(next);
    if (/^--[\w-]+=/.test(t)) { const k = t.indexOf('='); flags.push(t.slice(0, k) + '=' + path(t.slice(k + 1))); }
    else if (/^--[\w-]+$/.test(t)) flags.push(LONGVALS.has(t) && free ? t + '=' + path(rest[++i]) : t);
    else if (/^-[A-Za-z]+$/.test(t)) {
      const letters = [...t.slice(1)];
      letters.forEach((l, k) => flags.push('-' + l + (k === letters.length - 1 && vals.includes(l) && free ? '=' + rest[++i] : '')));
    }
    else pos.push(t === '>' || t === '>>' ? t : path(t));
  }
  return [cmd, ...pos, ...flags.sort()];
}

function same(input, expected) {
  return input.length === expected.length && input.every((t, i) => {
    const e = expected[i];
    return t === e || e === ANY || (e.endsWith('=' + ANY) && t.startsWith(e.slice(0, -ANY.length)));

}

function fill(task, pick) {

  const sub = s => s.replace(/\{(\w+?)(2?)\}/g, (m, k, two) => {
    if (!POOLS[k]) return m;

    if (!(key in v)) v[key] = pick(POOLS[k].filter(x => x !== v[other]));
    return v[key];

  const steps = Array.isArray(ans) && Array.isArray(ans[0]) ? ans.map(alts) : [alts(ans)];
  return {task, pack, lv, text: sub(text), why: sub(why),
    steps: steps.map(s => s.map(x => { const raw = sub(x); return {raw, key: canon(tokenize(raw))}; }))};
}

// ---------- block ----------
function spawn() {
  const floors = [...Array(S.lanes)].map((_, lane) => {
    const inLane = S.blocks.filter(b => b.lane === lane);
    const top = Math.min(Infinity, ...inLane.filter(b => !b.landed).map(b => b.y));
    const floor = Math.min(S.H, ...inLane.filter(b => b.landed).map(b => b.y));
    return {lane, top, floor};
  }).filter(l => l.top > 10);
  if (!floors.length) return false;
  const best = Math.max(...floors.map(l => l.floor));
  const lane = rnd(floors.filter(l => l.floor === best)).lane;

  const maxLv = Math.min(5, Math.ceil(S.level / 2));
  const fits = t => (S.pack === 'all' || t[0] === S.pack) && t[1] <= maxLv;
  let pool = TASKS.filter(t => fits(t) && !S.recent.includes(t));
  if (!pool.length) pool = TASKS.filter(fits);
  const weighted = pool.flatMap(t => Array(t[1]).fill(t)); // svårare uppgifter oftare när de låsts upp
  let b;
  for (let i = 0; i < 6; i++) { b = fill(rnd(weighted), rnd); if (!S.blocks.some(x => x.text === b.text)) break; }
  S.recent.push(b.task);
  if (S.recent.length > Math.min(8, pool.length - 1)) S.recent.shift();

  const el = document.createElement('div');
  el.className = 'blk';
  el.style.setProperty('--c', PACKS[b.pack].c);
  el.style.left = `calc(${lane * 100 / S.lanes}% + 4px)`;
  el.style.width = `calc(${100 / S.lanes}% - 8px)`;
  el.innerHTML = `<span class="tag">${PACKS[b.pack].tag}</span><p>${esc(b.text)}</p>` +
    (b.steps.length > 1 ? `<p class="prog">steg 1 av ${b.steps.length}</p>` : '') + '<code class="ans"></code>';
  well.append(el);
  Object.assign(b, {el, lane, step: 0, landed: false, h: el.offsetHeight});
  b.y = -b.h;
  S.blocks.push(b);
  return true;
}

function land(b) {
  b.landed = true;

  b.el.classList.add('landed');
  b.el.querySelector('.ans').textContent = '$ ' + show(b.steps[b.step][0].raw);
  S.streak = 0;
  out(`# missat: ${show(b.steps[b.step][0].raw)}`, 'hot');
  sfx('land');
}

function tick(dt) {
  S.time += dt;
  const speed = S.H / Math.max(7, 26 - 2 * (S.level - 1)); // sekunder från topp till botten
  if (!S.blocks.some(b => !b.landed)) S.spawnIn = Math.min(S.spawnIn, .5);
  if ((S.spawnIn -= dt) <= 0) S.spawnIn = spawn() ? Math.max(1.8, 7 - .55 * (S.level - 1)) : .3;

  for (let lane = 0; lane < S.lanes; lane++) {
    let floor = S.H;
    const inLane = S.blocks.filter(b => b.lane === lane);
    for (const b of inLane.filter(b => b.landed).sort((a, c) => a.order - c.order)) {
      b.y = Math.min(b.y + 900 * dt, floor - b.h); // faller ner när ett block under rensats
      floor = b.y;
    }
    for (const b of inLane.filter(b => !b.landed).sort((a, c) => c.y - a.y)) {
      b.y += speed * dt;
      if (b.y + b.h >= floor) {
        b.y = floor - b.h;
        land(b);
        if (b.y < 0) return gameOver();
      }
      floor = Math.min(floor, b.y);
    }
  }
  for (const b of S.blocks) b.el.style.transform = `translateY(${b.y}px)`;
  stats();
}

function remove(b) {
  S.blocks.splice(S.blocks.indexOf(b), 1);
  b.el.classList.add('done');
  setTimeout(() => b.el.remove(), 300);
}

// Poäng per rensat block. Ju högre upp blocket är när du löser det, desto snabbare var du.
// Landade block visar svaret, så de ger halva. combo = antal block rensade med samma Enter.
function points(b, combo, level) {
  const base = 10 * level * b.steps.length;
  if (b.landed) return Math.round(base / 2) * combo;
  return Math.round(base * (2 - Math.max(0, b.y) / S.H)) * combo;
}

// ---------- terminalen ----------
function out(text, cls = '') {
  for (const line of String(text).split('\n')) {
    const d = document.createElement('div');
    d.className = 'line ' + cls;
    d.textContent = line;
    log.append(d);
  }
  while (log.children.length > 60) log.firstChild.remove();
}

function echo(raw, bad, extra = '') {
  const d = document.createElement('div');
  d.className = 'line' + (bad.size ? ' bad' : '');
  const words = raw.split(/(\s+)/).map(w => (bad.has(w.replace(/^['"]|['"]$/g, '')) ? `<span class="err">${esc(w)}</span>` : esc(w)));
  d.innerHTML = `<span class="u">du@buildapp</span>:<span class="p">~/projekt</span>$ ${words.join('')}${extra}`;
  log.append(d);
}

// Hittar blocket som ett kommando löser: fallande före landade, lägst först
function target(key) {
  return S.blocks
    .filter(b => b.step < b.steps.length && b.steps[b.step].some(a => same(key, a.key)))
    .sort((a, c) => a.landed - c.landed || c.y - a.y)[0];
}

// Fel kommando: skriv det bash hade skrivit, eller rödmarkera det som skiljer mot närmaste block
function explain(u, bad, msgs) {
  const [c, sub] = u;
  if (!KNOWN.has(c)) return msgs.push(`bash: ${c}: command not found`);
  if (c === 'git' && sub?.startsWith('-')) return msgs.push(`unknown option: ${sub}\n${MISSING.git}`);
  if (c === 'git' && sub && !GIT.has(sub)) return msgs.push(`git: '${sub}' is not a git command. See 'git --help'.`);
  if (u.length === 1 && MISSING[c]) return msgs.push(MISSING[c]);
  let near = null, most = -1;
  for (const b of S.blocks) for (const a of b.steps[b.step] || []) {
    const tk = tokenize(a.raw);
    const hits = u.filter(t => tk.includes(t)).length;
    if (tk[0] === c && hits > most) { near = tk; most = hits; }
  }
  const flagOk = t => /^-[A-Za-z]+$/.test(t) && [...t.slice(1)].every(l => near.some(n => /^-[A-Za-z]+$/.test(n) && n.includes(l)));
  const wrong = near ? u.slice(1).filter(t => !near.includes(t) && !flagOk(t) && !near.includes(ANY)) : u.slice(1);
  (wrong.length ? wrong : u.length > 1 ? u.slice(1) : u).forEach(t => bad.add(t));
}

function run(raw) {
  if (!raw.trim()) return echo(raw, new Set());
  hist.push(raw); hpos = hist.length;
  let segs;
  try { segs = segments(tokenize(raw)); }
  catch (e) { echo(raw, new Set()); out(`bash: unexpected EOF while looking for matching \`${e.message}'`, 'err'); return fail(); }

  const hits = [], bad = new Set(), msgs = [], notes = [];
  let errs = 0, progressed = false;
  for (let seg of segs) {
    if (seg[0] === 'sudo') seg = seg.slice(1);
    if (!seg.length) continue;
    if (seg[0] === 'clear' && seg.length === 1) { clearCmd(); continue; }
    if (seg[0] === 'exit') { echo(raw, bad); return gameOver(); }
    if (seg[0] === 'help') { msgs.push('# Skriv kommandot som blocket beskriver. && eller flera argument rensar flera block.\n# ↑ hämtar förra kommandot, Esc pausar, exit avslutar, clear tömmer brunnen om du har en laddning.'); continue; }
    for (const u of units(seg)) {
      const b = target(canon(u));
      // --help är aldrig fel: visa hjälpen som det riktiga kommandot gör
      if (!b && KNOWN.has(u[0]) && (u.includes('--help') || (u[0] === 'git' && u[1] === '-h'))) {
        notes.push(u[0] === 'git' ? MISSING.git + '\n\n# riktiga git --help listar alla underkommandon, git <kommando> --help visar ett av dem' : `Usage: ${u[0]} [OPTION]...\n# riktiga ${u[0]} --help listar alla flaggor`);
        continue;
      }
      if (!b) { errs++; explain(u, bad, msgs); continue; }
      progressed = true;
      if (++b.step === b.steps.length) hits.push(b);
      else b.el.querySelector('.prog').textContent = `steg ${b.step + 1} av ${b.steps.length}`;
    }
  }
  echo(raw, bad);
  msgs.forEach(m => out(m, m.startsWith('#') ? 'cmt' : 'err'));
  notes.join('\n').split('\n').forEach(l => out(l, l.startsWith('#') ? 'cmt' : ''));
  if (progressed) S.typed += raw.length;

  const n = hits.length;
  for (const b of hits) {
    const p = points(b, n, S.level);
    S.score += p; S.cleared++;
    if (++S.streak % 10 === 0 && S.charges < 3) { S.charges++; out('# 10 rätt i rad: +1 clear. Skriv clear när brunnen börjar bli full.', 'hot'); }
    out(`# +${fmt(p)}  ${b.why}`, 'cmt');
    remove(b);
  }
  if (n > 1) { out(`# kombo x${n}`, 'hot'); sfx('combo', n); } else if (n || progressed) sfx('clear');

  const lv = S.start + Math.floor(S.cleared / 10);
  if (lv > S.level) { S.level = lv; out(`# nivå ${lv}: tempot ökar`, 'hot'); sfx('levelUp'); music(); }
  if (errs) fail();
  stats();
}

function fail() {
  S.streak = 0; S.errors++;
  sfx('error');
}

function clearCmd() {
  if (mode === 'play' && S.charges > 0) {
    S.charges--;
    [...S.blocks].forEach(remove);
    sfx('bomb');
    setTimeout(() => out('# clear: brunnen tömd', 'hot'));
  } else setTimeout(() => log.replaceChildren()); // som riktig clear: töm skärmen
}

// ---------- statistik ----------
const cpm = () => (S && S.time > 5 ? Math.round(S.typed / (S.time / 60)) : 0);
const best = () => load(HS, [])[0]?.s ?? 0;
let lastStats = '';
function stats() {
  const landed = S ? S.blocks.filter(b => b.landed).length : 0;
  const rows = [['pack', PACKS[S?.pack ?? prefs.pack].name], ['score', S?.score ?? 0], ['level', S?.level ?? prefs.level],
    ['cpm', cpm()], ['streak', S?.streak ?? 0], ['clear', S?.charges ?? 0], ['best', best()]];
  const key = rows.join() + landed + (S?.errors ?? 0);
  if (key === lastStats) return;
  lastStats = key;
  const lines = ['<span class="br">{</span>', ...rows.map(([k, v], i) =>
    `  <span class="k">"${k}"</span>: ${typeof v === 'string' ? `<span class="s">"${esc(v)}"</span>` : `<span class="n">${v}</span>`}${i < rows.length - 1 ? ',' : ''}`), '<span class="br">}</span>'];
  $('#code').innerHTML = lines.map((l, i) => `<span class="ln">${i + 1}</span><span>${l}</span>`).join('');
  $('#problems').textContent = $('#problems').dataset.n = landed;
  $('#st-err').innerHTML = `&#8855; ${S?.errors ?? 0} &#9888; ${landed}`;
  $('#st-level').textContent = `nivå ${S?.level ?? prefs.level}`;
  $('#st-score').textContent = `${fmt(S?.score ?? 0)} p`;
  $('#st-cpm').textContent = `${cpm()} CPM`;
  $('#st-clear').textContent = `clear ×${S?.charges ?? 0}`;
}

// ---------- skärmar ----------
function menu() {
  mode = 'menu';
  document.body.className = 'menu-on';
  well.querySelectorAll('.blk').forEach(e => e.remove());
  S = null;
  const scores = load(HS, []);
  screen.innerHTML = `<pre class="logo" aria-label="./terminal">${BANNER}</pre>
    <p>Uppgifter faller som block. Skriv rätt kommando innan de når botten.</p>
    <div class="cols"><div>
    <h2># paket <span class="dim">(↑ ↓ eller 1 till 4)</span></h2>
    <div class="opts">${Object.entries(PACKS).map(([k, p], i) =>
      `<button class="opt" data-pack="${k}" aria-pressed="${k === prefs.pack}">[${i + 1}] ${p.name.padEnd(16)}<span class="dim">${p.hint}</span></button>`).join('')}</div>
    <h2># startnivå <span class="dim">(← →)</span></h2>
    <div class="lvl"><button data-lv="-1" aria-label="Lägre nivå">&lsaquo;</button><b id="lv">${prefs.level}</b><span class="hot" id="bar">[${'#'.repeat(prefs.level)}${'-'.repeat(10 - prefs.level)}]</span><button data-lv="1" aria-label="Högre nivå">&rsaquo;</button></div>
    <div class="actions"><button data-act="start"><kbd>Enter</kbd> starta</button></div>
    </div><div>
    <h2># så funkar det</h2>
    <p>Lös vilket block som helst. <span class="hot">&&</span> eller flera argument (<span class="hot">mkdir a b</span>) rensar flera på en gång och ger kombo. 10 rätt i rad ger en <span class="hot">clear</span> som tömmer brunnen. Missade block visar svaret och kan fortfarande rensas för halva poängen.</p>
    ${matchMedia('(pointer:coarse)').matches ? '<p class="hot">Spelas bäst med tangentbord.</p>' : ''}
    <h2># topplista</h2>
    ${scores.length ? `<table class="scores">${scores.map((s, i) => `<tr><td>${i + 1}.</td><td>${fmt(s.s)} p</td><td>nivå ${s.l}</td><td>${s.c} CPM</td><td class="dim">${esc(PACKS[s.p]?.name ?? '')}</td><td class="dim">${new Date(s.d).toLocaleDateString('sv-SE', {day: 'numeric', month: 'short'})}</td></tr>`).join('')}</table>` : '<p class="dim">Inga resultat än.</p>'}
    </div></div>`;
  screen.hidden = false;
  stats();
  music();
}

function setLevel(d) {
  prefs.level = Math.max(1, Math.min(10, prefs.level + d));
  $('#lv').textContent = prefs.level;
  $('#bar').textContent = `[${'#'.repeat(prefs.level)}${'-'.repeat(10 - prefs.level)}]`;
  stats();
}
function setPack(k) {
  prefs.pack = k;
  screen.querySelectorAll('[data-pack]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pack === k));
  stats();
}

function gameOver() {
  mode = 'over';
  document.body.className = '';
  const entry = {s: S.score, l: S.level, c: cpm(), p: S.pack, d: new Date().toISOString().slice(0, 10)};
  const scores = load(HS, []);
  scores.push(entry);
  scores.sort((a, b) => b.s - a.s);
  const place = scores.indexOf(entry) + 1;
  save(HS, scores.slice(0, 10));
  stats();
  try { snd()?.stop(); } catch {}
  sfx(place === 1 && S.score > 0 ? 'newHighscore' : 'gameOver');
  shared = `./terminal · ${PACKS[S.pack].name} · nivå ${S.level} · ${fmt(S.score)} p · ${cpm()} CPM\nhttps://buildapp.se/ai/terminal.html`;
  screen.innerHTML = `<p class="dim">The terminal process "/usr/bin/bash" terminated with exit code: 1.</p>
    <pre class="logo over" aria-label="Game over">${OVER}</pre>
    <p><span class="hot">${fmt(S.score)} p</span> · nivå ${S.level} · ${cpm()} CPM · ${S.cleared} block · ${S.errors} fel</p>
    <p class="${place === 1 ? 'hot' : 'dim'}">${place === 1 && S.score > 0 ? 'Nytt rekord!' : place <= 10 ? `Plats ${place} på din topplista.` : 'Utanför topp 10.'}</p>
    <div class="actions"><button data-act="start"><kbd>Enter</kbd> spela igen</button><button data-act="share"><kbd>d</kbd> dela</button><button data-act="menu"><kbd>Esc</kbd> meny</button></div>
    <p id="shared" class="cmt"></p>`;
  screen.hidden = false;
}

function share() {
  const done = msg => { $('#shared').textContent = msg; };
  navigator.clipboard.writeText(shared).then(() => done('# kopierat, klistra in i en chatt'), () => done(shared));
}

function pause(on) {
  if (on && mode === 'play') {
    mode = 'pause';
    screen.innerHTML = '<p class="cmt"># pausad</p><div class="actions"><button data-act="resume"><kbd>Esc</kbd> fortsätt</button><button data-act="quit">avsluta</button></div>';
    screen.hidden = false;
    try { snd()?.stop(); } catch {}
  } else if (!on && mode === 'pause') {
    mode = 'play';
    screen.hidden = true;
    last = performance.now();
    cmd.focus();
    music();
  }
}

// ---------- inmatning ----------
// Egen blockmarkör: inputfältet är osynligt och spegeln ritar texten med markören där den står
function sync() {
  const v = cmd.value, i = cmd.selectionStart ?? v.length;
  mirror.innerHTML = `${esc(v.slice(0, i))}<span class="cur">${esc(v[i] ?? ' ')}</span>${esc(v.slice(i + 1))}`;
}
cmd.addEventListener('input', sync);
document.addEventListener('selectionchange', () => document.activeElement === cmd && sync());
cmd.addEventListener('focus', () => { term.classList.remove('blur'); sync(); });
cmd.addEventListener('blur', () => term.classList.add('blur'));
term.addEventListener('click', e => { if (!e.target.closest('button') && !getSelection().toString()) cmd.focus(); });
document.addEventListener('keydown', e => { if (document.activeElement !== cmd && !e.target.closest?.('button') && e.key.length === 1) cmd.focus(); });

screen.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.pack) setPack(t.dataset.pack);
  if (t.dataset.lv) setLevel(+t.dataset.lv);
  ({start, share, menu, resume: () => pause(false), quit: gameOver})[t.dataset.act]?.();
  cmd.focus();
});

cmd.addEventListener('keydown', e => {
  snd()?.init?.();
  const k = e.key;
  if (mode === 'menu') {
    if (k === 'Enter') start();
    else if (k >= '1' && k <= '4') setPack(Object.keys(PACKS)[k - 1]);
    else if (k === 'ArrowUp' || k === 'ArrowDown') {
      const keys = Object.keys(PACKS), i = keys.indexOf(prefs.pack) + (k === 'ArrowUp' ? -1 : 1);
      setPack(keys[(i + keys.length) % keys.length]);
    }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') setLevel(k === 'ArrowLeft' ? -1 : 1);
    else return;
    e.preventDefault();
    return music();
  }
  if (mode === 'over') {
    if (k === 'Enter') start(); else if (k === 'd') share(); else if (k === 'Escape') menu(); else return;
    return e.preventDefault();
  }
  if (mode === 'pause') { if (k === 'Escape' || k === 'Enter') { e.preventDefault(); pause(false); } return; }
  if (k === 'Enter') { e.preventDefault(); const v = cmd.value; cmd.value = ''; run(v); }
  else if (k === 'Escape') pause(true);
  else if (k === 'ArrowUp' || k === 'ArrowDown') {
    e.preventDefault();
    hpos = Math.max(0, Math.min(hist.length, hpos + (k === 'ArrowUp' ? -1 : 1)));
    cmd.value = hist[hpos] ?? '';
    cmd.setSelectionRange(cmd.value.length, cmd.value.length);
  } else if (e.ctrlKey && k === 'c' && !cmd.value.slice(cmd.selectionStart, cmd.selectionEnd)) {
    e.preventDefault(); echo(cmd.value, new Set(), '^C'); cmd.value = '';
  } else if (e.ctrlKey && k === 'l') { e.preventDefault(); log.replaceChildren(); }
  else if (k === 'Tab') e.preventDefault();
  else return;
  sync();
});

window.addEventListener('blur', () => pause(true));
window.addEventListener('resize', () => {
  if (!S) return;
  S.H = well.clientHeight;
  for (const b of S.blocks) b.h = b.el.offsetHeight;
});
$('#sound').addEventListener('click', () => setSound(!soundOn));

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  if (mode === 'play') tick(dt);
  requestAnimationFrame(frame);
}

setSound(soundOn);
menu();
sync();
cmd.focus();
requestAnimationFrame(frame);
</script>
</body>
</html>
