<!doctype html>
<!-- Source for /ai/og.png (1200x630), same method as buildapp.se and the old /ai.
     Rendera om med:  npx playwright screenshot --viewport-size=1200,630 og.source.html og.png
     Sidans egna tokens och typsnitt (DESIGN.md). Banan har ingen sol i mitten, som kartan.
     Planeternas färger är --bm-* ur index.html. -->
<html lang="sv"><head><meta charset="utf-8">
<style>
@font-face { font-family: "Unbounded"; src: url(fonts/unbounded-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Familjen Grotesk"; src: url(fonts/familjen-grotesk-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Familjen Grotesk"; src: url(fonts/familjen-grotesk-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
:root{--space:#05070d;--text:#e9edf5;--muted:rgb(233 237 245 / .68);--line:rgb(233 237 245 / .16)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:var(--space);color:var(--text);font-family:"Familjen Grotesk",sans-serif;
  position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:0 84px}
.orbit{position:absolute;right:-470px;top:-45px;width:900px;height:720px}
.brand{display:flex;align-items:center;gap:18px;margin-bottom:40px;font-weight:600;font-size:28px;color:var(--muted)}
.brand svg{width:56px;height:56px}
h1{font-family:"Unbounded",sans-serif;font-weight:700;font-size:76px;line-height:1.05;letter-spacing:-.01em;max-width:780px;position:relative}
p{font-size:32px;line-height:1.35;color:var(--muted);margin-top:30px;max-width:640px;position:relative}
</style></head><body>
<svg class="orbit" viewBox="0 0 900 720" aria-hidden="true">
  <g transform="rotate(-24 450 360)">
    <ellipse cx="450" cy="360" rx="400" ry="210" fill="none" stroke="rgb(233 237 245 / .16)" stroke-width="2"/>
    <ellipse cx="450" cy="360" rx="290" ry="150" fill="none" stroke="rgb(233 237 245 / .10)" stroke-width="2"/>
    <circle cx="74" cy="288" r="30" fill="#d97757"/>
    <circle cx="313" cy="163" r="14" fill="#4d6bfe"/>
    <circle cx="167" cy="508" r="20" fill="#08b962"/>
    <circle cx="212" cy="274" r="12" fill="#ff8205"/>
    <circle cx="177" cy="411" r="16" fill="#0082fb"/>
    <circle cx="650" cy="178" r="11" fill="#f4f4f2"/>
    <circle cx="351" cy="501" r="10" fill="#a59ffb"/>
  </g>
</svg>
<div class="brand">
  <svg viewBox="0 0 52 52">
    <rect x="1" y="1" width="50" height="50" rx="10" fill="#EDEAE2"/>
    <g transform="rotate(-24 26 26)">
      <ellipse cx="26" cy="26" rx="18" ry="10" fill="none" stroke="#211F1A" stroke-width="3.5"/>
      <circle cx="9" cy="22.6" r="7" fill="#211F1A"/>
      <circle cx="38.5" cy="33.3" r="5" fill="#211F1A"/>
    </g>
  </svg>
  buildapp.se/ai
</div>
<h1>Från idé till publicerad sida</h1>
<p>AI-bolagen på en karta, och sedan vägen till en sida på nätet, steg för steg.</p>
</body></html>
