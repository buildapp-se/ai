<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz: AI och programmering | Lär dig Claude Code</title>
<meta name="description" content="Fyra korta quiz om AI, terminalkommandon, programspråk och backend. Svara, se förklaringen, få ditt resultat.">
<link rel="canonical" href="https://buildapp.se/ai/quiz.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--fg:#14181F;--bg:#F4F6F8;--card:#fff;--primary:#6544E0;--secondary:#5A6472;--tertiary:#DDE3EA;
  --ok:#1F8A5B;--amber:#9A6100;--bad:#C0304A;
  --font:'Public Sans',system-ui,sans-serif;--font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --outer:clamp(1.25rem,4vw,2.5rem);--fs-small:.8125rem;--ls-heading:-.02em;--radius-btn:100px;--t:.16s ease}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.6}
.wrap{max-width:68ch;margin:0 auto;padding:0 var(--outer)}
.topbar{padding:1.1rem 0;border-bottom:1px solid var(--tertiary)}
.topbar a{font-size:var(--fs-small);color:var(--secondary);text-decoration:none}
.topbar a:hover{color:var(--primary)}

.card{margin:clamp(1.5rem,4vw,2.5rem) 0;background:var(--card);border:1px solid var(--tertiary);border-radius:14px;padding:clamp(1.4rem,4vw,2.5rem)}
.meta{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--secondary)}
h1,h2{font-family:var(--font-display);letter-spacing:var(--ls-heading);line-height:1.15}
h1{font-weight:800;font-size:clamp(1.8rem,4.5vw,2.4rem)}
h2{font-weight:700;font-size:clamp(1.2rem,3vw,1.5rem);margin-top:.6rem}
p{margin-top:.8rem;color:var(--secondary)}

.options{display:grid;gap:.6rem;margin-top:1.4rem}
.options button{font:inherit;text-align:left;cursor:pointer;padding:.85rem 1rem;min-height:48px;
  background:var(--card);color:var(--fg);border:1.5px solid var(--tertiary);border-radius:10px;transition:border-color var(--t),background var(--t)}
.options button:hover:not(:disabled){border-color:var(--primary)}
.options button:disabled{cursor:default}
.options button[aria-pressed=true]{border-color:var(--primary);background:#EFEBFC}
.options button.ok{border-color:var(--ok);background:#E8F5EE}
.options button.bad{border-color:var(--bad);background:#FBEAED}
.options button.ok::after{content:' ✓';color:var(--ok);font-weight:700}
.options button.bad::after{content:' ✗';color:var(--bad);font-weight:700}
.options button strong{display:block;font-family:var(--font-display);font-size:1.1rem}
.options button span{display:block;color:var(--secondary);font-size:.9rem}
.options button span.stats{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.02em;color:var(--primary);margin-top:.4rem}

/* Para ihop: begreppen till vänster, förklaringarna (blandade) till höger. */
.match{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:.6rem;margin-top:1.4rem}
.match .options{margin-top:0;align-content:start}
.match .terms button{font-family:var(--mono);font-weight:700}
.match .descs button{font-size:.9rem;padding:.7rem .8rem}

.feedback{margin-top:1.2rem;padding:1rem;border-radius:10px;background:var(--bg)}
.feedback strong{display:block;color:var(--fg)}
.feedback p{margin-top:.3rem}
.feedback #note{color:var(--fg)}
.feedback #note:not([hidden]) + #explain{margin-top:.7rem}
.feedback ul{list-style:none;margin-top:.6rem;color:var(--secondary)}
.feedback li{padding:.35rem 0;border-top:1px solid var(--tertiary)}
.feedback code{font-family:var(--mono);font-weight:700;color:var(--fg)}
.feedback .more{display:block;font-size:.9rem;margin-top:.2rem}
.feedback li:has(.more){padding:.6rem 0}
.next{font:inherit;font-weight:600;cursor:pointer;margin-top:1.4rem;padding:.7rem 1.4rem;min-height:44px;
  background:var(--primary);color:#fff;border:0;border-radius:var(--radius-btn)}
.next:hover{filter:brightness(1.1)}
.next.ghost{background:transparent;color:var(--primary);border:1.5px solid var(--primary);margin-left:.5rem}
.score{font-family:var(--mono);font-weight:700;font-size:clamp(2.5rem,8vw,3.5rem);color:var(--primary);margin-top:.6rem}
/* Svårighetsreglaget: grön, bärnsten, röd som sidans fasfärger. --lvl följer vald nivå. */
.level-box{--lvl:var(--ok);padding:.9rem 1.1rem 1rem;border:1.5px solid var(--tertiary);border-radius:10px;background:var(--bg)}
.level-box[data-level="1"]{--lvl:var(--amber)}
.level-box[data-level="2"]{--lvl:var(--bad)}
.level-box label{display:block;font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--secondary);margin-bottom:.5rem}
.level-box input{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;margin:0;background:transparent;cursor:pointer}
.level-box input::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--amber),var(--bad))}
.level-box input::-moz-range-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--ok),var(--amber),var(--bad))}
.level-box input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:#fff;border:4px solid var(--lvl);box-shadow:0 2px 6px rgba(20,24,31,.25);transition:transform var(--t),border-color var(--t)}
.level-box input::-moz-range-thumb{box-sizing:border-box;width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--lvl);box-shadow:0 2px 6px rgba(20,24,31,.25);transition:transform var(--t),border-color var(--t)}
.level-box input:active::-webkit-slider-thumb{transform:scale(1.12)}
.level-box input:active::-moz-range-thumb{transform:scale(1.12)}
.level-box input:focus{outline:none}
.level-box input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px rgba(101,68,224,.35)}
.level-box input:focus-visible::-moz-range-thumb{box-shadow:0 0 0 4px rgba(101,68,224,.35)}
.level-labels{display:flex;justify-content:space-between;margin-top:.3rem;font-size:.875rem;color:var(--secondary)}
.level-box[data-level="0"] .level-labels span:nth-child(1),
.level-box[data-level="1"] .level-labels span:nth-child(2),
.level-box[data-level="2"] .level-labels span:nth-child(3){color:var(--lvl);font-weight:700}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="./">&larr; Tillbaka till listan</a></div>

  <main class="card">
    <section id="menu">
      <h1>Quiz: AI och programmering</h1>
      <p>Välj ett quiz. Du ser förklaringen direkt efter varje svar.</p>
      <div class="options" id="quiz-list"></div>
      <div class="level-box" id="level-box" data-level="0">
        <label for="level">Svårighet för Tekniska ord</label>
        <input type="range" id="level" min="0" max="2" step="1" value="0" aria-valuetext="Lätt">
        <div class="level-labels" aria-hidden="true"><span>Lätt</span><span>Blandat</span><span>Svår</span></div>
      </div>
    </section>

    <section id="quiz" hidden>
      <p class="meta" id="progress"></p>
      <h2 id="question"></h2>
      <p id="hint" hidden>Tryck på ett ord till vänster och sedan på förklaringen som hör ihop med det.</p>
      <div id="answers"></div>
      <div class="feedback" id="feedback" aria-live="polite" hidden>
        <strong id="verdict"></strong>
        <p id="note" hidden></p>
        <p id="explain"></p>
        <ul id="about" hidden></ul>
      </div>
      <button class="next" id="next" type="button" hidden>Nästa</button>
    </section>

    <section id="result" hidden>
      <p class="meta" id="result-quiz"></p>
      <p class="score" id="score"></p>
      <h1 id="result-title"></h1>
      <p id="result-text"></p>
      <button class="next" id="restart" type="button">Gör om</button>
      <button class="next ghost" id="to-menu" type="button">Välj annat quiz</button>
    </section>
  </main>
</div>

// Avgör rubrik och text på resultatsidan utifrån hur många poäng man fick.
// Returnerar {title, text}.

const $ = id => document.getElementById(id);
// En upprepning av ett ord man svarat fel på ger inga poäng och räknas inte i totalen.
const points = s => s.retry ? 0 : s.pairs ? s.pairs.length : 1;
const MIXED = {title: 'Blandat', intro: 'Åtta slumpade delar ur alla quiz, ny mix varje gång.', mix: 8};

// Ord man klarat på första försöket sparas i webbläsaren (nyckeln står i integritet.html).
// ponytail: utan lagring (privat läge, blockerad) räknas alla ord som nya, quizet fungerar ändå.
const STORE = 'quiz-mastered';
function loadMastered() {
  try { return new Set(JSON.parse(localStorage.getItem(STORE)) || []); } catch { return new Set(); }
}
function remember(term, knew) {
  const m = loadMastered();
  knew ? m.add(term) : m.delete(term);
  try { localStorage.setItem(STORE, JSON.stringify([...m])); } catch {}
}
// Senaste och bästa resultat per quiz, nyckel = quizets titel (ordkorten per nivå, "Tekniska ord · Svår").
// Bäst = högst andel rätt, eftersom Blandat har olika antal poäng varje gång.
const RESULTS = 'quiz-results';
function loadResults() {
  try { return JSON.parse(localStorage.getItem(RESULTS)) || {}; } catch { return {}; }
}
function saveResult(key, score, total) {
  const all = loadResults();
  const prev = all[key];
  const best = prev?.best && prev.best[0] / prev.best[1] >= score / total ? prev.best : [score, total];
  all[key] = {last: [score, total], best, plays: (prev?.plays || 0) + 1};
  try { localStorage.setItem(RESULTS, JSON.stringify(all)); } catch {}
}
function statsText(key) {
  const r = loadResults()[key];
  if (!r?.last || !r.best) return 'Inte spelat än';
  return `Senast ${r.last[0]}/${r.last[1]} · bäst ${r.best[0]}/${r.best[1]} · spelat ${r.plays} ${r.plays === 1 ? 'gång' : 'gånger'}`;
}

function masteredCount(words) {
  const m = loadMastered();
  return words.filter(w => m.has(w[0])).length;
}

// Svårighet för ordkorten, styrs av reglaget i menyn. Varje nivå är en lista av gruppuppsättningar.
const LEVELS = ['Lätt', 'Blandat', 'Svår'];
let level = 0;
const levelSets = q => [[q.groups], [q.groups, q.hardGroups], [q.hardGroups]][level];
const activeWords = q => levelSets(q).flatMap(gs => gs.flat());
let chosen, quiz, step, score;

function shuffle(list) {
  const a = [...list];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function button(text, onclick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = text;
  b.onclick = onclick;
  return b;
}

function showOnly(id) {
  for (const s of ['menu', 'quiz', 'result']) $(s).hidden = s !== id;
}

// Gör ett flervalssteg av ett ord: rätt betydelse plus två betydelser ur samma grupp.
// Andra grupper används bara om gruppen skulle vara för liten.
function wordStep(word, groups) {
  const group = groups.find(g => g.includes(word));
  const near = shuffle(group.filter(w => w !== word));
  const far = shuffle(groups.flat().filter(w => !group.includes(w)));
  const others = [...near, ...far].slice(0, 2);
  const shown = shuffle([word, ...others]);
  return {
    word,
    groups,
    q: `Vad betyder "${word[0]}"?`,
    options: shown.map(w => w[1]),
    answer: shown.indexOf(word),
    notes: shown.map(w => w === word ? null : `Det där beskriver ${w[0]}.`),
    why: '',
  };
}

function start(q) {
  chosen = q;
  if (q.mix) quiz = {title: q.title, steps: shuffle(QUIZZES.flatMap(x => x.steps || [])).slice(0, q.mix)};
  else if (q.groups) {
    // Okända ord först, sedan fylls rundan på med redan klarade. Varje ord får
    // felalternativ ur sin egen nivås grupper.
    const sets = levelSets(q);
    const words = activeWords(q);
    const setOf = w => sets.find(gs => gs.some(g => g.includes(w)));
    const m = loadMastered();
    const order = [...shuffle(words.filter(w => !m.has(w[0]))), ...shuffle(words.filter(w => m.has(w[0])))];
    quiz = {title: `${q.title} · ${LEVELS[level]}`, words, steps: order.slice(0, q.round).map(w => wordStep(w, setOf(w)))};
  }
  else quiz = q;
  step = score = 0;
  showOnly('quiz');
  render();
}

function render() {
  const s = quiz.steps[step];
  $('progress').textContent = quiz.words
    ? `${quiz.title} · ${quiz.steps.length - step} kvar i högen`
    : `${quiz.title} · del ${step + 1} av ${quiz.steps.length}`;
  $('question').textContent = s.q || s.title;
  $('hint').hidden = !s.pairs;
  $('feedback').hidden = $('next').hidden = true;
  (s.pairs ? renderMatch : renderChoice)(s);
  $('question').focus();
}

function renderChoice(s) {
  const {options, answer, notes, why} = s;
  const list = document.createElement('div');
  list.className = 'options';
  list.append(...options.map((text, n) => button(text, () => {
    const buttons = [...list.children];
    buttons.forEach(b => b.disabled = true);
    buttons[answer].classList.add('ok');
    if (n === answer) {
      if (!s.retry) score++;
      if (s.word && !s.retry) remember(s.word[0], true);
      return done('Rätt!', {explain: why});
    }
    buttons[n].classList.add('bad');
    if (s.word) remember(s.word[0], false);
    // Ordkort: samma ord sist i högen igen, med nya felalternativ och ny ordning.
    if (s.word) quiz.steps.push({...wordStep(s.word, s.groups), retry: true});
    done(s.word ? 'Inte riktigt. Ordet kommer tillbaka längre fram.' : 'Inte riktigt.',
      {note: notes[n], explain: `Rätt svar: ${options[answer]}. ${why}`});
  })));
  $('answers').replaceChildren(list);
}

function renderMatch({pairs}) {
  let picked = {};
  const missed = new Set();
  let matched = 0;

  function pick(side, i, b) {
    picked[side]?.b.setAttribute('aria-pressed', 'false');
    picked[side] = {i, b};
    b.setAttribute('aria-pressed', 'true');
    if (!picked.term || !picked.desc) return;
    const {term, desc} = picked;
    picked = {};
    term.b.setAttribute('aria-pressed', 'false');
    desc.b.setAttribute('aria-pressed', 'false');
    if (term.i === desc.i) {
      for (const x of [term.b, desc.b]) { x.classList.add('ok'); x.disabled = true; }
      if (!missed.has(term.i)) score++;
      if (++matched === pairs.length) {
        const firstTry = pairs.length - missed.size;
        done(`Klart! ${firstTry} av ${pairs.length} rätt på första försöket.`,
          {about: pairs.filter(p => p[2]).map(([term, , name, more]) => [term, name, more])});
      }
    } else {
      missed.add(term.i);
      for (const x of [term.b, desc.b]) {
        x.classList.add('bad');
        setTimeout(() => x.classList.remove('bad'), 700);
      }
    }
  }

  const column = (cls, items) => {
    const col = document.createElement('div');
    col.className = `options ${cls}`;
    col.append(...items);
    return col;
  };
  const terms = pairs.map(([term], i) => button(term, function () { pick('term', i, this); }));
  const descs = shuffle(pairs.map(([, desc], i) => button(desc, function () { pick('desc', i, this); })));
  const grid = document.createElement('div');
  grid.className = 'match';
  grid.append(column('terms', terms), column('descs', descs));
  $('answers').replaceChildren(grid);
}

// note: varför det valda svaret var fel. explain: det rätta svaret och varför.
// about: lista [[begrepp, vad namnet betyder, mer kontext?], ...] efter en para ihop-omgång.
function done(verdict, {note = '', explain = '', about = []} = {}) {
  $('note').textContent = note;
  $('note').hidden = !note;
  $('about').hidden = !about.length;
  $('about').replaceChildren(...about.map(([term, name, more]) => {
    const li = document.createElement('li');
    const code = document.createElement('code');
    code.textContent = term;
    li.append(code, `: ${name}`);
    if (more) {
      const p = document.createElement('span');
      p.className = 'more';
      p.textContent = more;
      li.append(p);
    }
    return li;
  }));
  $('verdict').textContent = verdict;
  $('explain').textContent = explain;
  $('explain').hidden = !explain;
  $('feedback').hidden = $('next').hidden = false;
  $('next').textContent = step === quiz.steps.length - 1 ? 'Se resultat' : 'Nästa';
  $('next').focus();
}

$('next').onclick = () => {
  if (++step < quiz.steps.length) return render();
  const total = quiz.steps.reduce((sum, s) => sum + points(s), 0);
  const {title, text} = resultText(score, total);
  saveResult(quiz.title, score, total);
  $('result-quiz').textContent = quiz.words
    ? `${quiz.title} · ${masteredCount(quiz.words)} av ${quiz.words.length} ord klarade totalt`
    : quiz.title;
  $('score').textContent = `${score}/${total}`;
  $('result-title').textContent = title;
  $('result-text').textContent = text;
  showOnly('result');
  $('restart').focus();
};
$('restart').onclick = () => start(chosen);
$('to-menu').onclick = () => { renderMenu(); showOnly('menu'); };

const metaText = q => q.mix ? q.intro
  : q.groups ? `${q.intro} Du kan ${masteredCount(activeWords(q))} av ${activeWords(q).length} ord.`
  : `${q.intro} ${q.steps.reduce((sum, s) => sum + points(s), 0)} poäng.`;
// Samma nyckel som quiz.title i start(): ordkorten har en per nivå.
const resultKey = q => q.groups ? `${q.title} · ${LEVELS[level]}` : q.title;
let levelMeta, levelStats;

// Byggs om vid varje besök i menyn, så att antal klarade ord och resultat stämmer.
// Reglaget flyttas in direkt under ordkortens knapp.
function renderMenu() {
  $('quiz-list').replaceChildren(...[...QUIZZES, MIXED].flatMap(q => {
    const b = button('', () => start(q));
    const title = document.createElement('strong');
    const meta = document.createElement('span');
    const stats = document.createElement('span');
    title.textContent = q.title;
    meta.textContent = metaText(q);
    stats.className = 'stats';
    stats.textContent = statsText(resultKey(q));
    b.append(title, meta, stats);
    if (!q.groups) return [b];
    levelMeta = meta;
    levelStats = stats;
    return [b, $('level-box')];
  }));
}

// Uppdaterar bara texten: att bygga om menyn skulle flytta reglaget och ta fokus från det mitt i ett drag.
$('level').oninput = e => {
  level = +e.target.value;
  e.target.setAttribute('aria-valuetext', LEVELS[level]);
  $('level-box').dataset.level = level;
  const words = QUIZZES.find(q => q.groups);
  levelMeta.textContent = metaText(words);
  levelStats.textContent = statsText(resultKey(words));
};
renderMenu();
$('question').tabIndex = -1;
</script>
</body>
</html>
