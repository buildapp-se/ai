<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>./terminal | Lär dig terminalen</title>
<meta name="description" content="Uppgifter faller som tetrisblock. Skriv rätt terminalkommando innan de når botten: filer, git, GitHub och verktygen Claude Code använder.">
<link rel="canonical" href="https://buildapp.se/ai/terminal.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Färger från VS Code Dark Modern och dess terminal */
:root{color-scheme:dark;--bg:#181818;--editor:#1F1F1F;--border:#2B2B2B;--fg:#CCCCCC;--dim:#9D9D9D;--faint:#6E7681;--accent:#0078D4;
  --green:#23D18B;--blue:#3B8EEA;--red:#F14C4C;--yellow:#E5C07B;--comment:#6A9955;
  --key:#9CDCFE;--str:#CE9178;--num:#B5CEA8;--brace:#FFD700;
  --ui:"Segoe WPC","Segoe UI",system-ui,-apple-system,sans-serif;--mono:'JetBrains Mono',Consolas,Menlo,monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:13px/1.4 var(--ui);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block}
.win{display:flex;flex-direction:column;height:100dvh}

.titlebar{height:35px;flex:none;display:flex;align-items:center;gap:6px;padding-left:8px;background:var(--bg);border-bottom:1px solid var(--border);color:var(--dim)}
.titlebar img{width:16px;height:16px;margin-right:4px}
.menu span{padding:3px 7px;border-radius:4px}
.cmdcenter{flex:0 1 380px;margin:0 auto;height:24px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #3C3C3C;border-radius:6px;background:#222;color:var(--dim)}
.winctl{display:flex;height:100%}
.winctl span{width:46px;display:grid;place-items:center}

.main{flex:1;display:flex;min-height:0}
.activity{width:48px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:4px;color:#868686}
.activity span{width:48px;height:48px;display:grid;place-items:center}
.activity span:first-child{color:#D7D7D7;box-shadow:inset 2px 0 var(--accent)}
.activity .gear{margin-top:auto;width:48px;height:48px;display:grid;place-items:center;color:inherit}.activity .gear:hover{color:#D7D7D7}
.work{flex:1;display:flex;flex-direction:column;min-width:0}

.editor{flex:none;background:var(--editor)}
.tabs{display:flex;height:35px;background:var(--bg);border-bottom:1px solid var(--border)}
.tab{display:flex;align-items:center;gap:6px;padding:0 12px;border-right:1px solid var(--border);color:var(--dim)}
.tab.on{background:var(--editor);color:#fff;box-shadow:inset 0 1px var(--accent);margin-bottom:-1px}
.tab b{color:var(--brace);font-weight:400;font-family:var(--mono)}
.crumbs{padding:2px 16px;color:var(--dim);font-size:12px}
.code{display:grid;grid-template-columns:50px 1fr;font:13px/19px var(--mono);padding:2px 0 8px;white-space:pre}
.code .ln{color:var(--faint);text-align:right;padding-right:22px}
.k{color:var(--key)}.s{color:var(--str)}.n{color:var(--num)}.br{color:var(--brace)}

.panel{flex:1;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--border);background:var(--bg)}
.ptabs{height:35px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;font-size:11px;letter-spacing:.04em}
.ptabs{overflow:hidden}
.ptabs>span{padding:0 6px;line-height:33px;color:var(--dim);white-space:nowrap}
.ptabs>span.on{color:#E7E7E7;box-shadow:inset 0 -1px #E7E7E7}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#616161;color:#fff;text-align:center;line-height:18px;letter-spacing:0}
.badge[data-n="0"]{display:none}
.pright{margin-left:auto;display:flex;align-items:center;gap:12px;color:var(--dim);letter-spacing:0;font-size:12px}

.term{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 20px 6px;font:14px/1.4 var(--mono);cursor:text}
.well{position:relative;flex:1;min-height:0;overflow:hidden}
.log{flex:none;height:9.8em;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.prompt{flex:none;display:flex;flex-wrap:wrap;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.u{color:var(--green);font-weight:700}.p{color:var(--blue);font-weight:700}
.err{color:var(--red)}.cmt{color:var(--comment)}.hot{color:var(--yellow)}.dim{color:var(--faint)}
.line.bad{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.cmdbox{position:relative;flex:1 1 12ch;min-width:0}
#cmd{position:absolute;inset:0;width:100%;font:inherit;background:transparent;border:0;outline:0;color:transparent;caret-color:transparent}
#cmd::selection{background:#264F78;color:transparent}
#mirror{white-space:pre-wrap;overflow-wrap:anywhere;overflow:hidden}
.cur{background:var(--fg);color:var(--bg)}
.blur .cur{background:none;outline:1px solid var(--fg)}
.play .cur,.menu-on .cur{animation:blink 1.06s step-end infinite}
@keyframes blink{50%{background:none;color:inherit}}

/* Blocken: TUI-ramar i paketets färg */
.blk{position:absolute;top:0;padding:.55em .9em .5em;border:1px solid var(--c);background:var(--bg);will-change:transform;transition:opacity .3s,border-color .3s}
.blk .tag{position:absolute;top:-.75em;left:.7em;padding:0 .35em;background:var(--bg);color:var(--c);font-size:12px}
.blk p{color:#E7E7E7}
.blk .prog{color:var(--c);font-size:12px;margin-top:.2em}
.blk .ans{display:none;color:var(--dim);font-size:13px;margin-top:.25em}
.blk.landed{border-color:#4A4A4A;--c:#6E6E6E}
.blk.landed p{color:var(--dim)}
.blk.landed .ans{display:block}
.blk.done{opacity:0;border-color:var(--green);box-shadow:0 0 18px var(--green)}
.blk.miss{animation:shake .25s}
.blk{cursor:help}.blk:hover{box-shadow:0 0 0 1px var(--c)}
.blk .hlp{position:absolute;top:-.75em;right:.7em;padding:0 .35em;background:var(--bg);color:var(--c);font-size:12px}
.parts{display:grid;grid-template-columns:max-content 1fr;gap:.2em 2ch;margin:.6em 0;text-align:left}
.parts dt{color:var(--yellow);white-space:nowrap}.parts dd{margin:0}

.screen{position:absolute;inset:0;overflow:auto;padding:12px 0 8px;z-index:5;background:var(--bg)}
.screen[hidden]{display:none}
.logo{font:clamp(5px,1.5vw,12px)/1.1 var(--mono);color:var(--blue);white-space:pre;margin:4px 0 10px}
.logo.over{color:var(--red)}
.screen h2{font:inherit;color:var(--comment);margin-top:1.1em}
.cols{display:grid;gap:0 6ch}
@media (min-width:1000px){.cols{grid-template-columns:auto minmax(0,64ch)}}
.screen p{max-width:76ch}
.opts{display:flex;flex-direction:column;align-items:flex-start}
.opt{padding:1px 6px;margin-left:-6px;text-align:left;white-space:pre}
.opt[aria-pressed=true]{background:#264F78;color:#fff}
.opt:hover{background:#2A2D2E}
.opt[aria-pressed=true]:hover{background:#264F78}
.opt .dim{margin-left:1ch}
.lvl{display:flex;align-items:center;gap:1ch}
.lvl button{padding:0 6px;color:var(--blue)}
.scores{border-collapse:collapse}
.scores td{padding:0 2ch 0 0;white-space:nowrap}
.scores td:nth-child(2){text-align:right}
.actions{display:flex;flex-wrap:wrap;gap:1ch 3ch;margin-top:1.1em}
.actions button{color:var(--blue)}
.actions button:hover,.lvl button:hover{text-decoration:underline}
kbd{font:inherit;color:var(--yellow)}

.status{height:22px;flex:none;display:flex;align-items:center;border-top:1px solid var(--border);color:var(--fg);font-size:12px}
.status>span,.status>button{display:flex;align-items:center;gap:4px;height:100%;padding:0 8px;white-space:nowrap}
.status .remote{background:var(--accent);color:#fff;padding:0 10px}
.status .sp{margin-left:auto}
.status>button:hover{background:#2A2D2E}

@media (max-height:760px),(max-width:700px){.editor{display:none}}
@media (max-width:700px){.activity,.menu,.winctl,.status .hide,.ptabs>span:not(.on):not(:first-child),.pright{display:none}.term{padding:0 10px 6px;font-size:13px}.cmdcenter{flex-basis:auto;padding:0 12px}}
@media (prefers-reduced-motion:reduce){.blk{transition:none}.line.bad,.blk.miss{animation:none}}
</style>
</head>

<script>
/* pure:start  (ren logik utan DOM, testas av terminal.test.js) */
const PACKS = {
  fs: {name: 'Filer & mappar', tag: 'fil', c: '#4FC1FF', hint: 'mkdir, cd, ls, rm, mv, cp', psHint: 'New-Item, Set-Location, Get-ChildItem'},
  git: {name: 'Git & GitHub', tag: 'git', c: '#DCDCAA', hint: 'git, gh'},
  cc: {name: 'Som Claude Code', tag: 'claude', c: '#C586C0', hint: 'grep, curl, find, jq, npm', psHint: 'Select-String, Invoke-WebRequest, npm'},
  all: {name: 'Allt', hint: 'alla tre blandat'},
};

const POOLS = {
  d: ['musik', 'bilder', 'recept', 'kvitton', 'skola', 'backup', 'demo', 'assets', 'docs', 'src', 'semester', 'spel'],
  f: ['notes.txt', 'todo.md', 'index.html', 'app.js', 'style.css', 'data.json', 'README.md', 'config.yml', 'main.py'],
  log: ['server.log', 'app.log', 'error.log'],
  py: ['spel.py'], js: ['server.js'],
  b: ['dark-mode', 'fix-login', 'ny-meny', 'mobil-vy', 'kontaktsida'],
  repo: ['tradgard', 'receptbok', 'portfolio', 'spellista', 'budget'],
  msg: ['första versionen', 'fixa menyn', 'lägg till sök', 'rätta stavfel', 'ny startsida'],
  word: ['TODO', 'fetch', 'useState', 'password', 'API_KEY'],
  user: ['octocat', 'torvalds', 'sindresorhus'],
  pkg: ['zod', 'express', 'dotenv', 'lodash'],
};

// [paket, svårighet 1–5, uppgift, svar, förklaring, PowerShell-svar, PowerShell-förklaring]
// PowerShell-svaret '=' betyder samma som i bash. Saknas det visas uppgiften bara i bash.
// Svar: ett kommando eller en lista med godkända varianter.
// Kedja: en lista av listor, ett steg per kommando. {any} godtar vilket ord som helst.
const TASKS = [
  ['fs', 1, 'Skapa mappen {d}', 'mkdir {d}', 'mkdir = make directory. Skapar en ny mapp.', "New-Item -ItemType Directory {d}", "mkdir finns i PowerShell också, som genväg till New-Item -ItemType Directory."],
  ['fs', 1, 'Gå in i mappen {d}', 'cd {d}', 'cd = change directory. Byter mappen du står i.', "Set-Location {d}", "cd är ett alias för Set-Location. Alias är korta smeknamn på cmdlets."],
  ['fs', 1, 'Gå upp en nivå, till mappen ovanför', 'cd ..', '.. betyder alltid mappen ovanför den du står i.', "Set-Location ..", ".. är mappen ovanför, precis som i bash."],
  ['fs', 1, 'Visa vilken mapp du står i', 'pwd', 'pwd = print working directory. Skriver ut hela sökvägen.', "Get-Location", "pwd är ett alias för Get-Location."],
  ['fs', 1, 'Lista filerna i mappen du står i', ['ls', 'ls .'], 'ls = list. Visar filer och mappar här.', ["Get-ChildItem", "Get-ChildItem ."], "ls, dir och gci är alla alias för Get-ChildItem."],
  ['fs', 1, 'Skapa en tom fil som heter {f}', 'touch {f}', 'touch skapar filen om den saknas, annars uppdateras bara tidsstämpeln.', ["New-Item {f}", "New-Item -ItemType File {f}"], "touch finns inte i PowerShell. New-Item skapar en tom fil."],
  ['fs', 1, 'Visa innehållet i {f}', 'cat {f}', 'cat = concatenate. Skriver ut filen, eller flera filer efter varandra.', "Get-Content {f}", "cat och type är alias för Get-Content."],
  ['fs', 1, 'Kör spelet {py} med python', ['python {py}', 'python3 {py}'], 'python startar Python och kör filen. När programmet är klart får du tillbaka prompten.', 'python {py}', 'Samma i PowerShell. python är ett program, inte en cmdlet.'],
  ['fs', 1, 'Starta servern {js} med node', 'node {js}', 'node kör JavaScript utanför webbläsaren. En server står sedan kvar och väntar på besök.', '='],
  ['fs', 1, 'Gå till din hemmapp', ['cd', 'cd ~'], '~ är din hemmapp. cd utan argument går också dit.', ["Set-Location ~", "Set-Location $HOME"], "~ och $HOME är din hemmapp. cd utan något efter fungerar bara i PowerShell 7."],
  ['fs', 2, 'Ta bort filen {f}', 'rm {f}', 'rm = remove. Det finns ingen papperskorg, filen är borta direkt.', "Remove-Item {f}", "rm och del är alias för Remove-Item. Ingen papperskorg här heller."],
  ['fs', 2, 'Byt namn på {f} till {f2}', 'mv {f} {f2}', 'mv = move. Att byta namn är att flytta filen till ett nytt namn.', ["Rename-Item {f} {f2}", "Move-Item {f} {f2}"], "Rename-Item byter namn. Move-Item och mv fungerar också."],
  ['fs', 2, 'Kopiera {f} till {f2}', 'cp {f} {f2}', 'cp = copy.', "Copy-Item {f} {f2}", "cp och copy är alias för Copy-Item."],
  ['fs', 2, 'Flytta {f} in i mappen {d}', 'mv {f} {d}', 'Är målet en mapp hamnar filen i den, med samma namn.', "Move-Item {f} {d}", "Är målet en mapp hamnar filen i den, med samma namn."],
  ['fs', 2, 'Lista alla filer, även dolda', ['ls -a', 'ls -la', 'ls -A'], 'Filer som börjar med punkt, som .env och .gitignore, är dolda. -a = all.', "Get-ChildItem -Force", "Dolda filer syns bara med -Force. ls -a fungerar inte här."],
  ['fs', 2, 'Lista filerna med storlek och datum', ['ls -l', 'ls -la', 'ls -lh', 'ls -lah'], '-l = long. Visar rättigheter, ägare, storlek och datum.', "Get-ChildItem", "Get-ChildItem visar redan datum och storlek. ls -l ger fel, -l finns inte."],
  ['fs', 2, 'Ta bort den tomma mappen {d}', ['rmdir {d}', 'rm -d {d}', 'rm -r {d}'], 'rmdir vägrar om mappen inte är tom. Det är en säkerhetsspärr.', "Remove-Item {d}", "Remove-Item tar bort en tom mapp direkt. Är den inte tom frågar PowerShell först."],
  ['fs', 2, 'Gå direkt till mappen {d} i din hemmapp', 'cd ~/{d}', '~/ är en genväg till hemmappen, så det funkar var du än står.', ["Set-Location ~/{d}", "Set-Location $HOME/{d}"], "~ är hemmappen. Både / och \\ fungerar i sökvägar på Windows."],
  ['fs', 3, 'Ta bort mappen {d} och allt i den', ['rm -r {d}', 'rm -rf {d}', 'rm -R {d}'], '-r = recursive, allt i mappen följer med. -f = force, inga frågor. Dubbelkolla sökvägen.', ["Remove-Item {d} -Recurse", "Remove-Item {d} -Recurse -Force"], "-Recurse tar med allt inuti, -Force även dolda filer. rm -rf ger fel i PowerShell."],
  ['fs', 3, 'Skapa mappen {d2}/{d}, även om {d2} inte finns än', 'mkdir -p {d2}/{d}', '-p = parents. Skapar mapparna som saknas på vägen.', ["New-Item -ItemType Directory {d2}/{d}", "New-Item -ItemType Directory {d2}/{d} -Force"], "New-Item skapar mapparna som saknas på vägen av sig själv. Ingen -p behövs."],
  ['fs', 3, 'Kopiera mappen {d} med allt innehåll till {d2}', ['cp -r {d} {d2}', 'cp -R {d} {d2}', 'cp -a {d} {d2}'], '-r = recursive. Utan den vägrar cp kopiera mappar.', "Copy-Item {d} {d2} -Recurse", "-Recurse kopierar allt inuti. Utan den blir det bara en tom mapp."],
  ['fs', 3, 'Visa de 10 första raderna i {log}', ['head {log}', 'head -n 10 {log}', 'head -10 {log}'], 'head visar 10 rader om du inte säger något annat.', ["Get-Content {log} -TotalCount 10", "Get-Content {log} | Select-Object -First 10"], "-TotalCount, -Head och -First betyder samma sak."],
  ['fs', 3, 'Visa de 20 sista raderna i {log}', ['tail -n 20 {log}', 'tail -20 {log}'], 'tail = svansen. Perfekt för loggar, där det nya hamnar sist.', ["Get-Content {log} -Tail 20", "Get-Content {log} | Select-Object -Last 20"], "-Tail läser bara slutet av filen, snabbt även för stora loggar."],
  ['fs', 3, 'Skriv texten hej i terminalen', 'echo hej', 'echo skriver ut det du ger den. Mest användbart ihop med > och variabler.', "Write-Output hej", "echo är ett alias för Write-Output."],

const OPS = new Set(['|', '>', '>>', '&&', ';', '||']);
const ANY = '{any}';
// Korta flaggor som tar ett värde, per kommando, så att -m "text" hålls ihop när flaggorna sorteras
const VALS = {git: 'mbcCdD', head: 'nc', tail: 'nc', grep: 'eABCm', curl: 'XHdo', lsof: 'ip', ssh: 'ip', kill: 's', tar: 'fC', sed: 'e', du: 'd', sort: 'k'};
const LONGVALS = new Set(['--source', '--message', '--title', '--body', '--output', '--header', '--data', '--request', '--json']);

// Delar en rad som bash: citattecken, backslash och operatorer. Oavslutat citat kastar fel.
// I PowerShell är backslash ett vanligt tecken i sökvägar och backtick är escape.
function tokenize(s, ps = false) {
  const escape = ps ? '`' : '\\';
  const out = [];
  let cur = '', has = false, i = 0;
  const push = () => { if (has) out.push(cur); cur = ''; has = false; };
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { push(); i++; continue; }
    if (ch === "'") {
      const j = s.indexOf("'", i + 1);
      if (j < 0) throw new Error("'");
      cur += s.slice(i + 1, j); has = true; i = j + 1; continue;
    }
    if (ch === '"') {
      i++; has = true;
      while (i < s.length && s[i] !== '"') { if (s[i] === escape && i + 1 < s.length) i++; cur += s[i++]; }
      if (i >= s.length) throw new Error('"');
      i++; continue;
    }
    if (ch === escape && i + 1 < s.length) { cur += s[i + 1]; has = true; i += 2; continue; }
    const op = ['&&', '||', '>>', '|', ';', '>'].find(o => s.startsWith(o, i));
    if (op) { push(); out.push(op); i += op.length; continue; }
    cur += ch; has = true; i++;
  }
  push();
  return out;
}

// Delar på && ; || till separata kommandon
function segments(tokens) {
  const segs = [[]];
  for (const t of tokens) if (t === '&&' || t === ';' || t === '||') segs.push(Object.assign([], {op: t})); else segs.at(-1).push(t);
  return segs.filter(s => s.length);
}

// mkdir a b blir mkdir a + mkdir b, så att ett kommando kan rensa flera block
const MULTI = new Set(['mkdir', 'touch', 'rm', 'rmdir']);
function units(seg, ps = false) {
  const [cmd, ...rest] = seg;
  if (ps || !MULTI.has(cmd) || rest.some(t => OPS.has(t))) return [seg];
  const flags = rest.filter(t => t.startsWith('-')), args = rest.filter(t => !t.startsWith('-'));
  return args.length > 1 ? args.map(a => [cmd, ...flags, a]) : [seg];
}

const path = t => t.replace(/^\.\/(?=.)/, '').replace(/(.)\/$/, '$1');

// Normalform: positionella argument i ordning, flaggor sorterade och ihopslagna (-rn = -r -n)
function canon(seg, ps = false) {
  const out = [];
  let stage = [];
  const flush = () => { if (stage.length) out.push(...(ps ? canonPSStage : canonStage)(stage)); stage = []; };
  for (const t of seg) if (t === '|') { flush(); out.push('|'); } else stage.push(t);
  flush();
  return out;
}
function canonStage([cmd, ...rest]) {
  if (cmd === 'find') return [cmd, ...rest.map(path)]; // find har långa flaggor med ett streck, -name
  const vals = VALS[cmd] || '', pos = [], flags = [];
  for (let i = 0; i < rest.length; i++) {
    const t = rest[i], next = rest[i + 1];
    const free = next !== undefined && !next.startsWith('-') && !OPS.has(next);
    if (/^--[\w-]+=/.test(t)) { const k = t.indexOf('='); flags.push(t.slice(0, k) + '=' + path(t.slice(k + 1))); }
    else if (/^--[\w-]+$/.test(t)) flags.push(LONGVALS.has(t) && free ? t + '=' + path(rest[++i]) : t);
    else if (/^-[A-Za-z]+$/.test(t)) {
      const letters = [...t.slice(1)];
      letters.forEach((l, k) => flags.push('-' + l + (k === letters.length - 1 && vals.includes(l) && free ? '=' + rest[++i] : '')));
    }
    else pos.push(t === '>' || t === '>>' ? t : path(t));
  }
  return [cmd, ...pos, ...flags.sort()];
}

// effekterna från terminal-ljud.js. Ett spår per nivåband, tempot följer nivån via playbackRate.
function mp3Music(a) {
  const tracks = {}, {mute, setVolume} = a;
  let cur = null, vol = .8, muted = false;
  const apply = () => Object.values(tracks).forEach(t => (t.volume = muted ? 0 : vol * .6));
  Object.assign(a, {
    play(style) {
      const t = tracks[style] ??= Object.assign(new Audio(`_musik/${style}.mp3`), {loop: true});
      apply();
      if (t === cur) return;
      cur?.pause(); cur = t; t.currentTime = 0;

    stop() { cur?.pause(); cur = null; },
    // preservesPitch är på som standard: tempot höjs utan att tonen gör det. Över 1,25 låter det sönderstretchat.
    setTempo(r) { if (cur) cur.playbackRate = Math.min(r, 1.25); },
    setVolume(v) { setVolume(v); vol = v; apply(); },
    mute(m) { mute(m); muted = m; apply(); },
  });
}

// ---------- block ----------
// Lättare och vanligare uppgifter oftare, svåra då och då. Uppgifter i Filer & mappar får mallorden ur
// filsystemet och provkörs på en kopia, så att blocket bara ber om det som går att göra där du står.
function draw(pool) {
  const weighted = pool.flatMap(t => Array(6 - t[1]).fill(t));
  const near = [S.cwd, []].flatMap(at => Object.entries(look(S.fs, at, S.ps).node || {})).filter(([n]) => !n.startsWith('.')); // dolt hittar man själv
  const names = (list, k) => {
    if (k.endsWith('2')) return list.filter(n => look(S.fs, [...S.cwd, n], S.ps).node === undefined);
    const ext = {log: /\.log$/, py: /\.py$/, js: /\.js$/}[k];
    return [...new Set([...list, ...near.filter(([n, v]) => (k === 'd' ? typeof v === 'object' : typeof v === 'string' && (!ext || ext.test(n)))).map(([n]) => n)])];
  };
  for (let i = 0; i < 40; i++) {
    const t = rnd(weighted), b = fill(t, t[0] === 'fs' ? (list, k) => rnd(names(list, k)) : rnd, S.ps);
    if (!S.blocks.some(x => x.text === b.text) && (t[0] !== 'fs' || doable(b))) return b;
  }
  return null;
}
function doable(b) {
  const fs = structuredClone(S.fs);
  let cwd = S.cwd;
  try {
    for (const st of b.steps) {
      const r = fake(fs, cwd, st[0].key, S.ps);
      if (r?.same) return false;
      if (r) cwd = r.cwd;
    }
    return true;
  } catch { return false; }
}

function spawn() {
  const floors = [...Array(S.lanes)].map((_, lane) => {
    const inLane = S.blocks.filter(b => b.lane === lane);
    const top = Math.min(Infinity, ...inLane.filter(b => !b.landed).map(b => b.y));
    const floor = Math.min(S.H, ...inLane.filter(b => b.landed).map(b => b.y));
    return {lane, top, floor};
  }).filter(l => l.top > 10);
  if (!floors.length) return false;
  const best = Math.max(...floors.map(l => l.floor));
  const lane = rnd(floors.filter(l => l.floor === best)).lane;

  // Filer & mappar: ett block i taget, i ordning. Ny mapp: lista först, kör programmen som finns där, gå sedan in i en mapp.
  const story = S.pack === 'fs', here = S.cwd.join('/');
  if (story && S.blocks.some(b => !b.landed)) return false;
  const maxLv = Math.min(5, Math.ceil(S.level / 2));
  const fits = t => (S.pack === 'all' || t[0] === S.pack) && t[1] <= maxLv && (!S.ps || t[5]);
  let pool = TASKS.filter(t => fits(t) && !S.recent.includes(t));
  if (!pool.length) pool = TASKS.filter(fits);
  const lists = t => t[2] === 'Lista filerna i mappen du står i', runs = t => t[0] === 'fs' && /^(python|node) /.test(t[5] === '=' ? t[3] : t[5]);
  const enters = t => t[2] === 'Gå in i mappen {d}';
  const phases = story ? [!S.seen.has(here) && TASKS.filter(lists), !S.ran.has(here) && TASKS.filter(t => runs(t) && fits(t)), !S.went.has(here) && TASKS.filter(enters), pool] : [pool];
  let b = null;
  for (const ph of phases) if (ph && (b = draw(ph))) break;
  if (!b) return false;
  if (story && runs(b.task)) S.ran.add(here);
  if (story && enters(b.task)) S.went.add(here);
  S.recent.push(b.task);
  if (S.recent.length > Math.min(8, pool.length - 1)) S.recent.shift();

  const el = document.createElement('div');
  el.className = 'blk';
  el.style.setProperty('--c', PACKS[b.pack].c);
  el.style.left = `calc(${lane * 100 / S.lanes}% + 4px)`;
  el.style.width = `calc(${100 / S.lanes}% - 8px)`;
  el.innerHTML = `<span class="tag">${PACKS[b.pack].tag}</span><button class="hlp" tabindex="-1" aria-label="hjälp för blocket">?</button><p>${esc(b.text)}</p>` +
    (b.steps.length > 1 ? `<p class="prog">steg 1 av ${b.steps.length}</p>` : '') + '<code class="ans"></code>';
  el.addEventListener('click', () => help(b));
  well.append(el);
  Object.assign(b, {el, lane, step: 0, landed: false, h: el.offsetHeight});
  b.y = -b.h;
  S.blocks.push(b);
  return true;
}

function land(b) {
  b.landed = true;
  b.order = ++S.seq;
  b.el.classList.add('landed');
  b.el.querySelector('.ans').textContent = sig() + show(b.steps[b.step][0].raw);
  S.streak = 0;
  out(`# missat: ${show(b.steps[b.step][0].raw)}`, 'hot');
  sfx('land');
}

function tick(dt) {
  S.time += dt;
  const speed = S.H / Math.max(7, 26 - 2 * (S.level - 1)); // sekunder från topp till botten
  if (!S.blocks.some(b => !b.landed)) S.spawnIn = Math.min(S.spawnIn, .5);
  if ((S.spawnIn -= dt) <= 0) S.spawnIn = spawn() ? Math.max(1.8, 7 - .55 * (S.level - 1)) : .3;

  for (let lane = 0; lane < S.lanes; lane++) {
    let floor = S.H;
    const inLane = S.blocks.filter(b => b.lane === lane);
    for (const b of inLane.filter(b => b.landed).sort((a, c) => a.order - c.order)) {
      b.y = Math.min(b.y + 900 * dt, floor - b.h); // faller ner när ett block under rensats
      floor = b.y;
    }
    for (const b of inLane.filter(b => !b.landed).sort((a, c) => c.y - a.y)) {
      b.y += speed * dt;
      if (b.y + b.h >= floor) {
        b.y = floor - b.h;
        land(b);
        if (b.y < 0) return gameOver();
      }
      floor = Math.min(floor, b.y);
    }
  }
  for (const b of S.blocks) b.el.style.transform = `translateY(${b.y}px)`;
  stats();
}

function remove(b) {
  S.blocks.splice(S.blocks.indexOf(b), 1);
  b.el.classList.add('done');
  setTimeout(() => b.el.remove(), 300);
}

// Poäng per rensat block. Ju högre upp blocket är när du löser det, desto snabbare var du.
// Landade block visar svaret, så de ger halva. combo = antal block rensade med samma Enter.
function points(b, combo, level) {
  const base = 10 * level * b.steps.length;
  if (b.landed) return Math.round(base / 2); // ingen kombo på missade block, annars lönar det sig att vänta
  return Math.round(base * (2 - Math.max(0, b.y) / S.H)) * combo;
}

function echo(raw, bad, extra = '', cwd = S?.cwd) {

  d.className = 'line' + (bad.size ? ' bad' : '');
  const words = raw.split(/(\s+)/).map(w => (bad.has(w.replace(/^['"]|['"]$/g, '')) ? `<span class="err">${esc(w)}</span>` : esc(w)));

// Hittar blocket som ett kommando löser: fallande före landade, lägst först
function target(key) {
  return S.blocks
    .filter(b => b.step < b.steps.length && b.steps[b.step].some(a => same(key, a.key)))
    .sort((a, c) => a.landed - c.landed || c.y - a.y)[0];
}

// Fel kommando: skriv det bash hade skrivit, eller rödmarkera det som skiljer mot närmaste block
// Vanliga kommandon som spelet inte har block för svarar ändå, utan att räknas som fel
function toy([c], notes) {
  const k = S.ps ? psCmd(c) : c, now = new Date().toLocaleString('sv-SE', {dateStyle: 'full', timeStyle: 'medium'});
  const hs = S.ps ? ['', '  Id CommandLine', '  -- -----------', ...hist.map((h, i) => `${String(i + 1).padStart(4)} ${h}`), ''] : hist.map((h, i) => `${String(i + 1).padStart(5)}  ${h}`);
  const T = {whoami: S.ps ? 'buildapp\\du' : 'du', hostname: 'buildapp', date: now, 'get-date': now, history: hs, 'get-history': hs, h: hs}, t = T[k];
  if (!Object.hasOwn(T, k) ||(!S.ps && !['whoami', 'hostname', 'date', 'history'].includes(c))) return false;
  notes.push(...[].concat(t));
  return true;
}

function explain(u, bad, msgs) {
  const [c, sub] = u;
  if (S.ps) {
    if (!KNOWNPS.has(c.toLowerCase())) return msgs.push(`${c} : The term '${c}' is not recognized as the name of a cmdlet, function, script file, or operable program.\nCheck the spelling of the name, or if a path was included, verify that the path is correct and try again.`);
    const real = psCmd(c);
    for (const t of u.slice(1)) if (/^-[a-z]/i.test(t) && psparam(real, t.slice(1).toLowerCase().split(':')[0]) === null) {
      bad.add(t);
      return msgs.push(`${PSNAME[real] || c} : A parameter cannot be found that matches parameter name '${t.slice(1)}'.`);
    }
  } else if (!KNOWN.has(c)) return msgs.push(`bash: ${c}: command not found`);
  if (c === 'git' && sub?.startsWith('-')) return msgs.push(`unknown option: ${sub}\n${MISSING.git}`);
  if (c === 'git' && sub && !GIT.has(sub)) return msgs.push(`git: '${sub}' is not a git command. See 'git --help'.`);
  if (!S.ps && u.length === 1 && MISSING[c]) return msgs.push(MISSING[c]);
  let near = null, most = -1;
  for (const b of S.blocks) for (const a of b.steps[b.step] || []) {
    const tk = tokenize(a.raw, S.ps);
    const hits = u.filter(t => tk.includes(t)).length;
    if ((S.ps ? psCmd(tk[0]) === psCmd(c) : tk[0] === c) && hits > most) { near = tk; most = hits; }
  }
  const flagOk = t => /^-[A-Za-z]+$/.test(t) && [...t.slice(1)].every(l => near.some(n => /^-[A-Za-z]+$/.test(n) && n.includes(l)));
  const wrong = near ? u.slice(1).filter(t => !near.includes(t) && !flagOk(t) && !near.includes(ANY)) : u.slice(1);
  (wrong.length ? wrong : u.length > 1 ? u.slice(1) : u).forEach(t => bad.add(t));
}

function run(raw) {
  if (!raw.trim()) return echo(raw, new Set());
  hist.push(raw); hpos = hist.length;
  let segs;
  try { segs = segments(tokenize(raw, S.ps)); }
  catch (e) {
    echo(raw, new Set());
    out(S.ps ? 'The string is missing the terminator: ' + e.message + '.' : `bash: unexpected EOF while looking for matching \`${e.message}'`, 'err');
    return fail();
  }

  const andor = S.ps && segs.find(g => g.op === '&&' || g.op === '||')?.op;
  if (andor) {
    echo(raw, new Set());
    out(`The token '${andor}' is not a valid statement separator in this version.`, 'err');
    out('# PowerShell 5.1 har inte && och ||. Skriv ; mellan kommandona. && kom i PowerShell 7.', 'cmt');
    return fail();
  }
  const hits = [], bad = new Set(), msgs = [], notes = [], at = S.cwd;
  let errs = 0, progressed = false, typed = 0, prevOk = true;
  for (let seg of segs) {
    if ((seg.op === '&&' && !prevOk) || (seg.op === '||' && prevOk)) continue; // bash: && bara efter lyckat, || bara efter fel
    const errsBefore = errs;
    if (!S.ps && seg[0] === 'sudo') seg = seg.slice(1);
    if (!seg.length) continue;
    const c0 = S.ps ? seg[0].toLowerCase() : seg[0];
    if (['clear', 'cls', 'clear-host'].includes(seg[0].toLowerCase()) && seg.length === 1) { clearCmd(); continue; }
    if (c0 === 'exit') { echo(raw, bad); return gameOver(); }
    if (c0 === 'help') { msgs.push(`# Skriv kommandot som blocket beskriver. ${S.ps ? '; mellan kommandon' : '&& eller flera argument'} rensar flera block.\n# ↑ hämtar förra kommandot, Esc pausar, exit avslutar, ${S.ps ? 'cls' : 'clear'} tömmer brunnen om du har en laddning.`); continue; }
    for (const u of units(seg, S.ps)) {
      const key = canon(u, S.ps), b = target(key);
      // --help är aldrig fel: visa hjälpen som det riktiga kommandot gör
      if (!b && !S.ps && KNOWN.has(u[0]) && (u.includes('--help') || (u[0] === 'git' && u[1] === '-h'))) {
        notes.push(u[0] === 'git' ? MISSING.git + '\n\n# riktiga git --help listar alla underkommandon, git <kommando> --help visar ett av dem' : `Usage: ${u[0]} [OPTION]...\n# riktiga ${u[0]} --help listar alla flaggor`);
        continue;
      }
      // Filsystemet: block i Filer & mappar och fria kommandon körs på riktigt, på låtsas
      if (!b || b.pack === 'fs') {
        let r;
        try { r = fake(S.fs, S.cwd, key, S.ps); } catch (e) { errs++; msgs.push(e.message); continue; }
        // seen kan vara '', hemmappen
        if (r) { S.cwd = r.cwd; if (r.seen !== undefined) S.seen.add(r.seen); notes.push(...r.out); if (!b) continue; }
      }
      if (!b && toy(u, notes)) continue;
      if (!b) { errs++; explain(u, bad, msgs); continue; }
      progressed = true;
      typed += u.join(' ').length; // CPM räknar bara det som löste något
      if (++b.step === b.steps.length) hits.push(b);
      else b.el.querySelector('.prog').textContent = `steg ${b.step + 1} av ${b.steps.length}`;
    }
    prevOk = errs === errsBefore;
  }
  echo(raw, bad, '', at);
  if (S.cwd !== at) applyShell();
  msgs.forEach(m => out(m, m.startsWith('#') ? 'cmt' : 'err'));
  notes.join('\n').split('\n').forEach(l => out(l, l.startsWith('#') ? 'cmt' : ''));
  S.typed += typed;

  const n = hits.length;
  for (const b of hits) {
    const p = points(b, n, S.level);
    S.score += p; S.cleared++;
    if (++S.streak % 10 === 0 && S.charges < 3) { S.charges++; out('# 10 rätt i rad: +1 clear. Skriv clear när brunnen börjar bli full.', 'hot'); }
    out(`# +${fmt(p)}  ${b.why}`, 'cmt');
    remove(b);
  }
  if (n > 1) { out(`# kombo x${n}`, 'hot'); sfx('combo', n); } else if (n || progressed) sfx('clear');

  const lv = S.start + Math.floor(S.cleared / 10);
  if (lv > S.level) { S.level = lv; out(`# nivå ${lv}: tempot ökar`, 'hot'); sfx('levelUp'); music(); }
  if (errs) fail(errs); // varje fel räknas, så att ett makro med ; inte lönar sig
  stats();
}

function fail(n = 1) {
  S.streak = 0; S.errors += n;
  sfx('error');
}

function clearCmd() {
  if (mode === 'play' && S.charges > 0) {
    S.charges--;
    [...S.blocks].forEach(remove);
    sfx('bomb');
    setTimeout(() => out('# clear: brunnen tömd', 'hot'));
  } else setTimeout(() => log.replaceChildren()); // som riktig clear: töm skärmen
}

// ---------- statistik ----------
const cpm = () => (S && S.time > 5 ? Math.round(S.typed / (S.time / 60)) : 0);
const best = () => scoresLoad()[0]?.s ?? 0;
let lastStats = '';
function stats() {
  const landed = S ? S.blocks.filter(b => b.landed).length : 0;
  const rows = [['shell', (S?.ps ?? isPS()) ? 'PowerShell' : 'bash'], ['pack', PACKS[S?.pack ?? prefs.pack].name], ['score', S?.score ?? 0], ['level', S?.level ?? prefs.level],
    ['cpm', cpm()], ['streak', S?.streak ?? 0], ['clear', S?.charges ?? 0], ['best', best()]];
  const key = rows.join() + landed + (S?.errors ?? 0);
  if (key === lastStats) return;
  lastStats = key;
  const lines = ['<span class="br">{</span>', ...rows.map(([k, v], i) =>
    `  <span class="k">"${k}"</span>: ${typeof v === 'string' ? `<span class="s">"${esc(v)}"</span>` : `<span class="n">${v}</span>`}${i < rows.length - 1 ? ',' : ''}`), '<span class="br">}</span>'];
  $('#code').innerHTML = lines.map((l, i) => `<span class="ln">${i + 1}</span><span>${l}</span>`).join('');
  $('#problems').textContent = $('#problems').dataset.n = landed;
  $('#st-err').innerHTML = `&#8855; ${S?.errors ?? 0} &#9888; ${landed}`;
  $('#st-level').textContent = `nivå ${S?.level ?? prefs.level}`;
  $('#st-score').textContent = `${fmt(S?.score ?? 0)} p`;
  $('#st-cpm').textContent = `${cpm()} CPM`;
  $('#st-clear').textContent = `clear ×${S?.charges ?? 0}`;
}

// ---------- skärmar ----------
function menu() {
  mode = 'menu';
  document.body.className = 'menu-on';
  well.querySelectorAll('.blk').forEach(e => e.remove());
  S = null;
  const scores = scoresLoad();
  screen.innerHTML = `<pre class="logo" aria-label="./terminal">${BANNER}</pre>
    <p>Uppgifter faller som block. Skriv rätt kommando innan de når botten.</p>
    <div class="cols"><div>
    <h2># skal <span class="dim">(s byter)</span></h2>
    <div class="opts">${shellOpts()}</div>
    <h2># paket <span class="dim">(↑ ↓ eller 1 till 4)</span></h2>
    <div class="opts">${Object.entries(PACKS).map(([k, p], i) =>
      `<button class="opt" data-pack="${k}" aria-pressed="${k === prefs.pack}">[${i + 1}] ${p.name.padEnd(16)}<span class="dim">${isPS() && p.psHint || p.hint}</span></button>`).join('')}</div>
    <h2># startnivå <span class="dim">(← →)</span></h2>
    <div class="lvl"><button data-lv="-1" aria-label="Lägre nivå">&lsaquo;</button><b id="lv">${prefs.level}</b><span class="hot" id="bar">[${'#'.repeat(prefs.level)}${'-'.repeat(10 - prefs.level)}]</span><button data-lv="1" aria-label="Högre nivå">&rsaquo;</button></div>
    <div class="actions"><button data-act="start"><kbd>Enter</kbd> starta</button></div>
    </div><div>
    <h2># så funkar det</h2>
    <p>Lös vilket block som helst. ${isPS() ? '<span class="hot">;</span> mellan kommandon' : '<span class="hot">&&</span> eller flera argument (<span class="hot">mkdir a b</span>)'} rensar flera på en gång och ger kombo. Klicka på ett block för hjälp. 10 rätt i rad ger en <span class="hot">clear</span> som tömmer brunnen. Missade block visar svaret och kan fortfarande rensas för halva poängen.</p>
    ${matchMedia('(pointer:coarse)').matches ? '<p class="hot">Spelas bäst med tangentbord.</p>' : ''}
    <h2># topplista</h2>
    ${scores.length ? `<table class="scores">${scores.map((s, i) => `<tr><td>${i + 1}.</td><td>${fmt(s.s)} p</td><td>nivå ${s.l}</td><td>${s.c} CPM</td><td class="dim">${esc(PACKS[s.p]?.name ?? '')}</td><td class="dim">${new Date(s.d).toLocaleDateString('sv-SE', {day: 'numeric', month: 'short'})}</td></tr>`).join('')}</table>` : '<p class="dim">Inga resultat än.</p>'}
    </div></div>`;
  screen.hidden = false;
  stats();
  music();
}

// ---------- skal och inställningar ----------
const SHELLS = [['ps', 'PowerShell', 'Windows, det du har i VS Code'], ['bash', 'bash', 'Mac, Linux, Git Bash och servrar']];
const shellOpts = (cur = prefs.shell, locked = false) => SHELLS.map(([k, name, hint]) =>
  `<button class="opt" data-shell="${k}" aria-pressed="${k === cur}"${locked ? ' disabled' : ''}>${name.padEnd(12)}<span class="dim">${hint}</span></button>`).join('');
function applyShell() {
  const ps = S?.ps ?? isPS();
  $('#ps1').innerHTML = promptHTML(ps, S?.cwd);
  $('#shname').textContent = ps ? 'powershell' : 'bash';
  $('#lang').textContent = ps ? 'PowerShell' : 'Shell Script';
  stats();
}
function setShell(k) {
  prefs.shell = k;
  save(SHELL, k);
  applyShell();
  if (mode === 'menu') menu();
  else screen.querySelectorAll('[data-shell]').forEach(b => b.setAttribute('aria-pressed', b.dataset.shell === k));
}
const otherShell = () => (prefs.shell === 'ps' ? 'bash' : 'ps');

// Första besöket: en fråga innan menyn. Förvalet gissas från datorn.
function askShell() {
  mode = 'shell';
  prefs.shell = /win/i.test(navigator.userAgentData?.platform || navigator.platform) ? 'ps' : 'bash';
  screen.innerHTML = `<pre class="logo" aria-label="./terminal">${BANNER}</pre>
    <h2># vilket skal kör du?</h2>
    <div class="opts">${shellOpts()}</div>
    <p class="dim"># förvalt: ${prefs.shell === 'ps' ? 'PowerShell, för att du sitter på Windows' : 'bash'}. Enter väljer, ↑ ↓ byter.</p>
    <p class="dim"># går att ändra sen i menyn och under inställningar.</p>`;
  screen.hidden = false;
}

// Inställningar, som i VS Code: kugghjulet längst ner i sidofältet eller Ctrl+,
let backTo = 'menu';
function settings() {
  if (mode === 'settings') return closeSettings();
  if (mode === 'play') pause(true);
  backTo = mode === 'pause' ? 'pause' : 'menu';
  mode = 'settings';
  const locked = backTo === 'pause';
  screen.innerHTML = `<p class="cmt"># inställningar</p>
    <h2># skal <span class="dim">${locked ? '(byts när rundan är slut)' : '(s byter)'}</span></h2>
    <div class="opts">${shellOpts(prefs.shell, locked)}</div>
    <h2># ljud</h2>
    <div class="opts"><button class="opt" data-snd="1" aria-pressed="${soundOn}">på</button><button class="opt" data-snd="0" aria-pressed="${!soundOn}">av</button></div>
    <div class="actions"><button data-act="back"><kbd>Esc</kbd> tillbaka</button></div>`;
  screen.hidden = false;
}
function closeSettings() {
  if (backTo === 'pause') { mode = 'play'; pause(true); } else menu();
}

function setLevel(d) {
  prefs.level = Math.max(1, Math.min(10, prefs.level + d));
  $('#lv').textContent = prefs.level;
  $('#bar').textContent = `[${'#'.repeat(prefs.level)}${'-'.repeat(10 - prefs.level)}]`;
  stats();
}
function setPack(k) {
  prefs.pack = k;
  screen.querySelectorAll('[data-pack]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pack === k));
  stats();
}

function gameOver() {
  mode = 'over';
  document.body.className = '';
  const entry = {s: S.score, l: S.level, c: cpm(), p: S.pack, d: new Date().toISOString().slice(0, 10)};
  const scores = scoresLoad();
  if (!S.helped && S.score > 0) { scores.push(entry); scores.sort((a, b) => b.s - a.s); save(HS, scores.slice(0, 10)); }
  const place = S.helped || !S.score ? 0 : scores.indexOf(entry) + 1;
  stats();
  try { snd()?.stop(); } catch {}
  sfx(place === 1 && S.score > 0 ? 'newHighscore' : 'gameOver');
  shared = `./terminal · ${PACKS[S.pack].name} · nivå ${S.level} · ${fmt(S.score)} p · ${cpm()} CPM\nhttps://buildapp.se/ai/terminal.html`;
  screen.innerHTML = `<p class="dim">The terminal process "${S.ps ? 'C:&#92;WINDOWS&#92;System32&#92;WindowsPowerShell&#92;v1.0&#92;powershell.exe' : '/usr/bin/bash'}" terminated with exit code: 1.</p>
    <pre class="logo over" aria-label="Game over">${OVER}</pre>
    <p><span class="hot">${fmt(S.score)} p</span> · nivå ${S.level} · ${cpm()} CPM · ${S.cleared} block · ${S.errors} fel</p>
    <p class="${place === 1 ? 'hot' : 'dim'}">${S.helped ? 'Hjälpen användes, så rundan sparas inte på topplistan.' : place === 1 && S.score > 0 ? 'Nytt rekord!' : place <= 10 ? `Plats ${place} på din topplista.` : 'Utanför topp 10.'}</p>
    <div class="actions"><button data-act="start"><kbd>Enter</kbd> spela igen</button><button data-act="share"><kbd>d</kbd> dela</button><button data-act="menu"><kbd>Esc</kbd> meny</button></div>
    <p id="shared" class="cmt"></p>`;
  screen.hidden = false;
}

// Hjälpkortet: pausar och visar svaret del för del. Rundan hamnar då inte på topplistan.
function help(b) {
  if (mode !== 'play') return;
  S.helped = true;
  pause(true);
  const step = b.steps[b.step];
  screen.innerHTML = `<p class="cmt"># ${esc(b.text)}</p>
    ${b.steps.length > 1 ? `<p class="dim">steg ${b.step + 1} av ${b.steps.length}</p>` : ''}
    <p>${sig()}${esc(show(step[0].raw))}</p>
    ${b.other ? `<p class="dim"># i ${S.ps ? 'bash' : 'PowerShell'}: ${esc(show(b.other))}</p>` : ''}
    <dl class="parts">${parts(step[0].raw, S.ps).map(([p, d]) => `<dt>${esc(show(p))}</dt><dd>${esc(d || '')}</dd>`).join('')}</dl>
    ${step.length > 1 ? `<p class="dim">godkänns också: ${step.slice(1, 3).map(a => esc(show(a.raw))).join(' · ')}</p>` : ''}
    <p class="cmt"># ${esc(b.why)}</p>
    <p class="dim"># rundan hamnar inte på topplistan när du har använt hjälpen</p>
    <div class="actions"><button data-act="resume"><kbd>Esc</kbd> fortsätt</button></div>`;
}

function share() {
  const done = msg => { $('#shared').textContent = msg; };
  navigator.clipboard.writeText(shared).then(() => done('# kopierat, klistra in i en chatt'), () => done(shared));
}

function pause(on) {
  if (on && mode === 'play') {
    mode = 'pause';
    screen.innerHTML = '<p class="cmt"># pausad</p><div class="actions"><button data-act="resume"><kbd>Esc</kbd> fortsätt</button><button data-act="quit">avsluta</button></div>';
    screen.hidden = false;
    try { snd()?.stop(); } catch {}
  } else if (!on && mode === 'pause') {
    mode = 'play';
    screen.hidden = true;
    last = performance.now();
    cmd.focus();
    music();
  }
}

// ---------- inmatning ----------
// Egen blockmarkör: inputfältet är osynligt och spegeln ritar texten med markören där den står
function sync() {
  const v = cmd.value, i = cmd.selectionStart ?? v.length;
  mirror.innerHTML = `${esc(v.slice(0, i))}<span class="cur">${esc(v[i] ?? ' ')}</span>${esc(v.slice(i + 1))}`;
}
cmd.addEventListener('input', sync);
document.addEventListener('selectionchange', () => document.activeElement === cmd && sync());
cmd.addEventListener('focus', () => { term.classList.remove('blur'); sync(); });
cmd.addEventListener('blur', () => term.classList.add('blur'));
term.addEventListener('click', e => { if (!e.target.closest('button') && !getSelection().toString()) cmd.focus(); });
document.addEventListener('keydown', e => { if (document.activeElement !== cmd && !e.target.closest?.('button') && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) cmd.focus(); }); // Ctrl+C ska kopiera markeringen, inte flytta fokus

screen.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.pack) setPack(t.dataset.pack);
  if (t.dataset.shell && !t.disabled) { setShell(t.dataset.shell); if (mode === 'shell') menu(); }
  if (t.dataset.snd) { setSound(t.dataset.snd === '1'); screen.querySelectorAll('[data-snd]').forEach(b => b.setAttribute('aria-pressed', (b.dataset.snd === '1') === soundOn)); }
  if (t.dataset.lv) setLevel(+t.dataset.lv);
  ({start, share, menu, resume: () => pause(false), quit: gameOver, back: closeSettings})[t.dataset.act]?.();
  cmd.focus();
});

const typing = e => !e.ctrlKey && !e.metaKey && !e.altKey && (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete');
cmd.addEventListener('keydown', e => {
  try { snd()?.init?.(); } catch {} // ljud som inte kan starta får aldrig stoppa tangenterna
  const k = e.key;
  if (e.ctrlKey && k === ',' && mode !== 'shell' && mode !== 'over') { e.preventDefault(); return settings(); }
  if (mode === 'shell') {
    if (k === 'Enter') { setShell(prefs.shell); menu(); }
    else if (['ArrowUp', 'ArrowDown', '1', '2'].includes(k)) setShell(k === '1' ? 'ps' : k === '2' ? 'bash' : otherShell());
    else if (!typing(e)) return;
    return e.preventDefault();
  }
  if (mode === 'settings') {
    if (k === 'Escape') closeSettings();
    else if (k === 's' && backTo === 'menu') setShell(otherShell());
    else if (!typing(e)) return;
    return e.preventDefault();
  }
  if (mode === 'menu') {
    if (k === 'Enter') start();
    else if (k === 's') setShell(otherShell());
    else if (k >= '1' && k <= '4') setPack(Object.keys(PACKS)[k - 1]);
    else if (k === 'ArrowUp' || k === 'ArrowDown') {
      const keys = Object.keys(PACKS), i = keys.indexOf(prefs.pack) + (k === 'ArrowUp' ? -1 : 1);
      setPack(keys[(i + keys.length) % keys.length]);
    }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') setLevel(k === 'ArrowLeft' ? -1 : 1);
    else if (typing(e)) return e.preventDefault();
    else return;
    e.preventDefault();
    return music();
  }
  if (mode === 'over') {
    if (k === 'Enter') start(); else if (k === 'd') share(); else if (k === 'Escape') menu(); else if (!typing(e)) return;
    return e.preventDefault();
  }
  if (mode === 'pause') { if (k === 'Escape' || k === 'Enter') { e.preventDefault(); pause(false); } else if (typing(e)) e.preventDefault(); return; } // inget förskrivet svar under paus
  if (k === 'Enter') { e.preventDefault(); const v = cmd.value; cmd.value = ''; run(v); }
  else if (k === 'Escape') pause(true);
  else if (k === 'ArrowUp' || k === 'ArrowDown') {
    e.preventDefault();
    hpos = Math.max(0, Math.min(hist.length, hpos + (k === 'ArrowUp' ? -1 : 1)));
    cmd.value = hist[hpos] ?? '';
    cmd.setSelectionRange(cmd.value.length, cmd.value.length);
  } else if (e.ctrlKey && k === 'c' && !cmd.value.slice(cmd.selectionStart, cmd.selectionEnd)) {
    e.preventDefault(); echo(cmd.value, new Set(), '^C'); cmd.value = '';
  } else if (e.ctrlKey && k === 'l') { e.preventDefault(); log.replaceChildren(); }
  else if (k === 'Tab') e.preventDefault();
  else return;
  sync();
});

window.addEventListener('blur', () => pause(true));
window.addEventListener('resize', () => {
  if (!S) return;
  S.H = well.clientHeight;
  for (const b of S.blocks) b.h = b.el.offsetHeight;
});
$('#sound').addEventListener('click', () => setSound(!soundOn));
$('#gear').addEventListener('click', () => { settings(); cmd.focus(); });

function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  try { if (mode === 'play') tick(dt); } catch (e) { console.error(e); } // ponytail: ett fel ska synas i konsolen, inte frysa spelet
  requestAnimationFrame(frame);
}

setSound(soundOn);
if (prefs.shell) { applyShell(); menu(); } else { askShell(); applyShell(); }
sync();
cmd.focus();
requestAnimationFrame(frame);
</script>
</body>
</html>
