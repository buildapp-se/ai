<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="52" height="52">
  <!-- Solsystemet utan sol: en bana med tre planeter och tomt i mitten. Bara ink och wall ur buildapp.se CONTEXT.md. -->
  <style>
    .bg{fill:#211F1A} .fg{fill:#EDEAE2} .orbit{fill:none;stroke:#EDEAE2}
    @media (prefers-color-scheme: dark){ .bg{fill:#EDEAE2} .fg{fill:#211F1A} .orbit{stroke:#211F1A} }
  </style>
  <rect x="1" y="1" width="50" height="50" rx="10" class="bg"/>
  <g transform="rotate(-24 26 26)">
    <ellipse cx="26" cy="26" rx="18" ry="10" class="orbit" stroke-width="3.5"/>
    <circle cx="9" cy="22.6" r="7" class="fg"/>
    <circle cx="38.5" cy="33.3" r="5" class="fg"/>
  </g>
</svg>
